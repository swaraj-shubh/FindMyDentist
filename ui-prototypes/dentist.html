  <div class="grid split" style="grid-template-columns:minmax(0,1fr) 360px;align-items:start"><div class="card"><table class="tbl"><thead><tr><th>Post</th><th>Type</th><th>Consent</th><th>Status</th><th class="num">Views</th><th></th></tr></thead><tbody>${db().posts.map(p => `<tr><td><b>${esc(p.title)}</b></td><td>${p.type}</td><td>${p.consent ? badge(p.consent, 'ok') : '<span class="muted">—</span>'}</td><td>${badge(p.status, { Published: 'ok', Review: 'warn', Draft: 'line' }[p.status])}</td><td class="num">${p.views.toLocaleString('en-IN')}</td><td>${p.status !== 'Published' ? `<button class="btn sm" data-act="post-next" data-id="${p.id}">${p.status === 'Draft' ? 'Submit' : 'Publish'}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
  <form class="card pad col" data-form="compose"><h3>New post</h3><label class="f">Title<input class="input" id="cp-title" name="title" required value="${esc(c.title)}" data-input="cp" data-k="title"></label><label class="f">Type<select class="input" name="type" data-change="cp" data-k="type">${['Education', 'Case', 'Reel'].map(x => `<option ${x === c.type ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    ${c.type === 'Case' ? `<label class="f">Patient consent<select class="input" name="consent" data-change="cp" data-k="consent"><option value="">Select consent record…</option><option ${c.consent === 'CF-221 ✓' ? 'selected' : ''}>CF-221 ✓</option></select></label>${c.consent ? '' : `<div class="notice bad small">${ic('lock', 15)} Case posts can’t be submitted without documented consent.</div>`}` : ''}
    <label class="f">Body<textarea class="input" id="cp-body" name="body" data-input="cp" data-k="body" placeholder="Write, or let AI draft it">${esc(c.body)}</textarea></label>
    <button type="button" class="btn" data-act="cp-ai">${ic('spark', 15)} AI draft</button>${c.ai ? `<label class="check"><input type="checkbox" data-change="cp-rev" ${c.reviewed ? 'checked' : ''}><span class="small">I reviewed this AI draft for accuracy.</span></label>` : ''}
    <button class="btn pri" ${(c.type === 'Case' && !c.consent) || (c.ai && !c.reviewed) ? 'disabled' : ''}>Save as draft</button></form></div>`; };

/* ---------- INSIGHTS ---------- */
const Insights = () => { const m = Array.from({ length: 6 }, (_, i) => { const d = new Date(); d.setMonth(d.getMonth() - 5 + i); return d.toLocaleDateString('en-IN', { month: 'short' }); });
  return `${ph('Insights', 'Your practice at a glance · last 6 months', '<span class="demo">Mock analytics</span>')}
  <div class="grid g4">${[['Patients seen', '412', '+8% vs prior', 'up'], ['Root canals', '96', '+12%', 'up'], ['Chair utilisation', '84%', '+3 pts', 'up'], ['No-show rate', '4.1%', '−0.6 pts', 'up']].map(k => `<div class="card kpi"><p class="eyebrow">${k[0]}</p><div class="v">${k[1]}</div><div class="d ${k[3]}">${k[2]}</div></div>`).join('')}</div>
  <div class="grid g2 mt16"><div class="card pad"><h3>Treatment revenue (your procedures)</h3>${Charts.bars(m.map((l, i) => ({ l, v: [182000, 196000, 210500, 204000, 231000, 248500][i] })), { fmtv: v => '₹' + Math.round(v / 1000) + 'k', label: 'Monthly treatment revenue' })}</div>
  <div class="card pad"><h3>Visits vs FMD bookings</h3>${Charts.line([{ n: 'All visits', v: [62, 66, 71, 68, 74, 79], c: 'var(--c1)' }, { n: 'Booked via FMD', v: [14, 18, 21, 24, 29, 33], c: 'var(--c3)' }], m, { label: 'Visits and FMD bookings' })}</div>
  <div class="card pad"><h3>Procedure mix</h3>${Charts.bars([{ l: 'RCT', v: 96, c: 'var(--c1)' }, { l: 'Consult', v: 138, c: 'var(--c2)' }, { l: 'Retreat', v: 21, c: 'var(--c3)' }, { l: 'Crown', v: 44, c: 'var(--c4)' }], { label: 'Procedure mix' })}</div>
  <div class="card pad"><h3>Patient experience</h3>${[['Communication', 4.9], ['Appointment access', 4.6], ['Environment', 4.8], ['Overall', 4.9]].map(r => `<div class="mt12"><div class="row between small"><span>${r[0]}</span><b>${r[1]}</b></div><div class="progress mt4"><i style="width:${r[1] / 5 * 100}%"></i></div></div>`).join('')}<p class="tiny muted mt12">FMD rates experience, never clinical outcomes.</p></div></div>`; };

const Settings = () => `${ph('Settings', 'Preferences for your workspace', `<button class="btn" data-act="guide">${ic('palette', 16)} Show UI guide again</button>`)}<div class="grid g2">${[['Morning brief at 8:00', true], ['AI scribe in chairside mode', true], ['Allow AI to draft patient replies', true], ['Auto-send messages without approval', false, 'Locked by clinic policy'], ['Notify me of new referrals', true], ['Show patient photos in schedule', false]].map(s => `<label class="card pad row between" style="cursor:pointer"><span><b class="small">${s[0]}</b>${s[2] ? `<br><span class="tiny muted">${s[2]}</span>` : ''}</span><input type="checkbox" ${s[1] ? 'checked' : ''} ${s[2] ? 'disabled' : ''} style="width:20px;height:20px;accent-color:var(--teal)"></label>`).join('')}</div>`;
</script>
<script>
/* =========================================================
   ACTIONS + ROUTER
   ========================================================= */
const now = () => TODAY + 'T' + nowHM();
const route = () => { const [p, id] = (location.hash.slice(2) || 'today').split('/'); return { p, id }; };
const PAGES = { today: Today, schedule: Schedule, patients: Patients, patient: Patient, assistant: Assistant, inbox: Inbox, profile: Profile, content: Content, insights: Insights, settings: Settings };
let timerInt;
function render() {
  const { p, id } = route(), root = document.getElementById('root');
  const fid = document.activeElement?.id, sel = document.activeElement?.selectionStart;
  clearInterval(timerInt);
  if (p === 'chair') { document.body.classList.add('in-chair'); root.innerHTML = Chair(id); startTimer(id); }
  else { document.body.classList.remove('in-chair'); const page = PAGES[p] ? p : 'today'; root.innerHTML = Shell(page === 'patient' ? 'patients' : page, PAGES[page](id)); }
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch {} } }
  if (typeof Guide !== 'undefined' && Guide.el) requestAnimationFrame(() => Guide.draw());
}
function startTimer(id) { const c = V.chair[id]; const paint = () => { const el = document.getElementById('chair-timer'); if (el && c?.start) { const s = Math.floor((Date.now() - c.start) / 1000); el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); } }; paint(); if (c?.start) timerInt = setInterval(paint, 1000); }
const logChart = (p, tooth, to) => { p.history.push({ at: now(), tooth, from: p.chart[tooth] || 'sound', to }); if (to === 'sound') delete p.chart[tooth]; else p.chart[tooth] = to; };

const SCRIBE = 'Patient reports mild discomfort since last visit, no swelling. Tooth 36 temporary intact. Rubber dam placed. Canals irrigated with sodium hypochlorite, master cones fitted, obturation with warm vertical compaction. Post-op IOPA satisfactory. Advised soft diet, crown in two weeks.';
const aiPlan = q => {
  const t = q.toLowerCase(), rct = todays().filter(a => a.kind === 'endo');
  if (/prescri|what should i (give|treat)|diagnos|which antibiotic/.test(t)) return { risk: 'clinical', blocked: true, out: 'I can’t decide prescriptions or diagnoses. I can show the patient’s allergies (Aarav: penicillin allergy) and relevant guideline summaries — the clinical decision is yours.' };
  if (/follow.?up|message/.test(t)) return { risk: 'external', out: rct.map(a => `To ${P(a.patientId).name}: Hi ${P(a.patientId).name.split(' ')[0]}, some tenderness after today’s root canal visit is normal for 2–3 days. Call us if you notice swelling. — Dr. Mehta`).join('\n\n'), count: rct.length };
  if (/explain|simple words|patient.?friendly/.test(t)) return { risk: 'draft', out: 'DRAFT — “A root canal cleans out the inflamed nerve inside your tooth and seals it, so the tooth can stay. You’ll feel pressure, not pain, because the tooth is numb. A crown afterwards protects it from cracking.”\n\nReview before sharing.' };
  if (/recall|overdue/.test(t)) return { risk: 'read', out: db().patients.filter(p => p.lastVisit < day(-150)).map(p => `• ${p.name} — last visit ${dLabel(p.lastVisit)}`).join('\n') || 'No overdue recalls.' };
  if (/referral|tara/.test(t)) return { risk: 'draft', out: 'DRAFT — “Thanks Tara, happy to see Mr. Pillai. I’ve reviewed the CBCT summary and will assess 46 for retreatment on his visit today at 14:30. I’ll send my findings after.”' };
  return { risk: 'read', out: `Today: ${todays().length} patients, ${todays().filter(a => a.kind === 'endo').length} root canals, ${todays().filter(a => a.status === 'done').length} done. Alerts: ${todays().map(a => P(a.patientId)).filter(p => p.alerts.length).map(p => p.name + ' (' + p.alerts[0] + ')').join(', ')}.` };
};
const runAI = q => {
  const pl = aiPlan(q), t = { id: uid('T'), q, ...pl, state: 'Running', stage: 0, time: nowHM(), out: '' };
  db().aiTasks.unshift(t); Store.commit();
  const step = () => { const x = db().aiTasks.find(y => y.id === t.id); if (!x) return;
    if (x.stage === 2 && x.risk === 'clinical') { x.state = 'Blocked'; x.out = pl.out; return Store.commit(); }
    if (x.stage === 3) { x.out = pl.out; if (x.risk === 'external') { x.state = 'Needs approval'; return Store.commit(); } }
    x.stage++; if (x.stage >= STEPS.length) { x.state = 'Done'; x.out = pl.out; return Store.commit(); }
    Store.commit(); setTimeout(step, 380); };
  setTimeout(step, 380);
};

const Actions = {
  'sched-day': el => { V.sDay = el.dataset.v; render(); },
  'sched-tip': () => { V.sf.tip = false; render(); },
  'sched-search': () => { V.sf.open = !V.sf.open; if (!V.sf.open) V.sf.q = ''; render(); document.getElementById('sched-q')?.focus(); },
  'sched-reset': () => { Object.assign(V.sf, { kind: '', chair: '', status: '', time: '', q: '' }); render(); },
  close: () => UI.close(),
  nav: () => { document.body.classList.remove('appear-open'); document.body.classList.toggle('nav-open'); },
  appear: el => { const on = document.body.classList.toggle('appear-open'); document.querySelectorAll('.appear-btn').forEach(b => b.setAttribute('aria-expanded', on)); Guide.el && Guide.draw(); },
  guide: () => { location.hash = '#/today'; setTimeout(() => Guide.start(), 120); },
  reset: () => { if (confirm('Reset all demo data for this prototype?')) { Store.reset(); UI.toast('Demo data reset'); } },
  tab: el => { V.tabs[el.dataset.g] = el.dataset.v; render(); },
  week: el => { V.weekOff = +el.dataset.v === 0 ? 0 : (V.weekOff || 0) + +el.dataset.v; render(); },
  appt: el => { const a = A(el.dataset.id); if (!a.patientId) return; const p = P(a.patientId);
    UI.drawer(esc(p.name), `<div class="row wrap">${badge(KIND[a.kind][0], KIND[a.kind][1])}${stBadge(a.status)}</div><dl class="mt16" style="display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:13.5px"><dt class="muted">When</dt><dd style="margin:0">${dLabel(a.date)} · ${a.time}–${addMin(a.time, a.mins)}</dd><dt class="muted">Visit</dt><dd style="margin:0">${esc(a.title)}</dd><dt class="muted">Chair</dt><dd style="margin:0">${a.chair}</dd><dt class="muted">Phone</dt><dd style="margin:0">${p.phone}</dd></dl>${p.alerts.length ? `<div class="notice bad mt16 small">${ic('alert', 15)} ${esc(p.alerts.join(' · '))}</div>` : ''}${a.prep.length ? `<h3 class="mt16">Prep</h3><ul class="small">${a.prep.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}`,
      `${a.status === 'scheduled' ? `<button class="btn danger" data-act="status" data-id="${a.id}" data-v="no-show">No-show</button><button class="btn" data-act="status" data-id="${a.id}" data-v="arrived">Arrived</button>` : ''}<a class="btn" href="#/patient/${p.id}" data-act="close-go">Chart</a>${a.status !== 'done' && a.date === TODAY ? `<a class="btn teal" href="#/chair/${a.id}" data-act="close-go">Chairside</a>` : ''}`, `${p.age} yrs · ${p.sex === 'M' ? 'Male' : 'Female'}`); },
  'close-go': el => { UI.close(); location.hash = el.getAttribute('href'); },
  status: el => { A(el.dataset.id).status = el.dataset.v; UI.close(); Store.commit(); UI.toast('Marked ' + STATUS[el.dataset.v][0].toLowerCase()); },
  'new-appt': el => { const d = el.dataset; UI.modal('New appointment', `<form data-form="appt" id="na" class="grid g2"><label class="f" style="grid-column:1/-1">Patient<select class="input" name="patientId">${db().patients.map(p => `<option value="${p.id}" ${p.id === d.p ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label><label class="f">Date<input type="date" class="input" name="date" value="${d.d || TODAY}" required></label><label class="f">Time<input type="time" class="input" name="time" value="${d.t || '17:00'}" step="900" required></label><label class="f">Type<select class="input" name="kind">${Object.entries(KIND).filter(k => k[0] !== 'blocked').map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select></label><label class="f">Duration<select class="input" name="mins"><option>20</option><option selected>30</option><option>45</option><option>60</option></select></label><div id="na-err" style="grid-column:1/-1"></div></form>`, `<button class="btn" data-act="close">Cancel</button><button class="btn pri" form="na">Book</button>`); },
  tooth: el => { V.tooth = V.tooth === +el.dataset.v ? null : +el.dataset.v; render(); },
  cond: el => { logChart(P(el.dataset.id), V.tooth, el.dataset.v); Store.commit(); UI.toast(`Tooth ${V.tooth}: ${el.dataset.v}`); },
  'note-new': el => UI.modal('New clinical note', `<form data-form="note" data-id="${el.dataset.id}" id="nn"><label class="f">Note<textarea class="input" name="text" rows="6" required></textarea></label></form>`, `<button class="btn" data-act="close">Cancel</button><button class="btn pri" form="nn">Save unsigned</button>`),
  'note-accept': el => { db().notes.find(n => n.id === el.dataset.id).accepted = true; Store.commit(); UI.toast('Draft accepted — now sign it'); },
  'note-sign': el => { const n = db().notes.find(n => n.id === el.dataset.id); if (n.ai && !n.accepted) return UI.toast('Accept the AI draft first', 'warn'); n.signed = true; Store.commit(); UI.toast('Signed — note is now locked'); },
  'note-amend': el => UI.modal('Amend signed note', `<p class="small muted">The original stays unchanged; your amendment is added with a timestamp.</p><form data-form="amend" data-id="${el.dataset.id}" id="am" class="mt12"><textarea class="input" name="text" required></textarea></form>`, `<button class="btn" data-act="close">Cancel</button><button class="btn pri" form="am">Add amendment</button>`),
  'plan-add': el => UI.modal('Add to treatment plan', `<form data-form="plan" data-id="${el.dataset.id}" id="pl" class="grid g2"><label class="f" style="grid-column:1/-1">Treatment<input class="input" name="t" required placeholder="e.g. Zirconia crown"></label><label class="f">Tooth<input class="input" name="tooth" value="${V.tooth || ''}" required></label><label class="f">Fee (₹)<input class="input" type="number" min="0" name="fee" required></label></form>`, `<button class="btn" data-act="close">Cancel</button><button class="btn pri" form="pl">Add & send to patient</button>`),
  'ai-explain': el => { location.hash = '#/assistant'; setTimeout(() => runAI('Explain root canal treatment to ' + P(el.dataset.id).name.split(' ')[0] + ' in simple words'), 50); },
  'chair-start': el => { V.chair[el.dataset.id].start = Date.now(); const a = A(el.dataset.id); a.status = 'in-chair'; Store.commit(); },
  'chair-tooth': el => { const c = V.chair[route().id]; c.tooth = c.tooth === +el.dataset.v ? null : +el.dataset.v; render(); },
  'chair-cond': el => { const a = A(el.dataset.id), c = V.chair[a.id]; logChart(P(a.patientId), c.tooth, el.dataset.v); Store.commit(); },
  'chair-proc': el => { const c = V.chair[el.dataset.id], v = el.dataset.v; c.procs = c.procs.includes(v) ? c.procs.filter(x => x !== v) : [...c.procs, v]; render(); },
  'chair-rx': el => { const c = V.chair[el.dataset.id], v = el.dataset.v; c.rx = c.rx.includes(v) ? c.rx.filter(x => x !== v) : [...c.rx, v]; render(); },
  scribe: el => { const c = V.chair[el.dataset.id]; c.recording = true; render(); const words = SCRIBE.split(' '); let i = c.transcript ? words.length : 0; c._t = setInterval(() => { if (!c.recording || i >= words.length) { clearInterval(c._t); c.recording = false; return render(); } c.transcript = words.slice(0, ++i).join(' '); render(); }, 90); },
  'scribe-stop': el => { V.chair[el.dataset.id].recording = false; render(); },
  'scribe-draft': el => { const a = A(el.dataset.id), c = V.chair[a.id]; const ex = db().notes.find(n => n.chairId === a.id); const text = `${a.title}.\n${c.transcript}${c.procs.length ? '\nProcedures: ' + c.procs.join(', ') + '.' : ''}${c.rx.length ? '\nRx: ' + c.rx.join('; ') + '.' : ''}`;
    if (ex) { if (ex.signed) return UI.toast('Note already signed — use Amend', 'warn'); ex.text = text; } else db().notes.push({ id: uid('N'), patientId: a.patientId, chairId: a.id, at: now(), text, signed: false, ai: true, accepted: false, amendments: [] }); Store.commit(); UI.toast('AI draft ready — review, accept and sign'); },
  'chair-finish': el => { const a = A(el.dataset.id), c = V.chair[a.id], p = P(a.patientId), note = db().notes.find(n => n.chairId === a.id), fee = { endo: 6500, consult: 700, review: 0, surgery: 2000 }[a.kind];
    UI.modal('Complete visit', `${!note?.signed ? `<div class="notice warn small">${ic('alert', 15)} The visit note isn’t signed yet. You can still complete and sign later.</div>` : `<div class="notice ok small">${ic('check', 15)} Note signed.</div>`}<dl class="mt16" style="display:grid;grid-template-columns:130px 1fr;gap:8px;font-size:13.5px"><dt class="muted">Procedures</dt><dd style="margin:0">${esc(c.procs.join(', ') || '—')}</dd><dt class="muted">Prescription</dt><dd style="margin:0">${esc(c.rx.join('; ') || '—')}</dd><dt class="muted">Charge (est.)</dt><dd style="margin:0">${fmt(fee)} → sent to front desk billing</dd></dl>
      <label class="f mt16">Next visit<select class="input" id="nextv"><option value="">No follow-up</option><option value="7">In 1 week</option><option value="14" ${a.kind === 'endo' ? 'selected' : ''}>In 2 weeks</option><option value="180">6-month recall</option></select></label><p class="tiny muted mt8">${esc(p.name)} gets a visit summary in their FMD app — without clinical detail in the notification.</p>`, `<button class="btn" data-act="close">Back</button><button class="btn teal" data-act="chair-done" data-id="${a.id}">Complete visit</button>`); },
  'chair-done': el => { const a = A(el.dataset.id), c = V.chair[a.id], nv = document.getElementById('nextv').value; a.status = 'done'; P(a.patientId).lastVisit = TODAY;
    db().visits.push({ patientId: a.patientId, date: TODAY, summary: `${a.title} — ${c.procs.length} procedures` });
    if (nv) db().appts.push({ id: uid('A'), date: day(+nv), time: a.time, mins: a.mins, patientId: a.patientId, kind: +nv > 30 ? 'review' : a.kind, title: +nv > 30 ? 'Recall check-up' : a.title.replace(/stage \d/, 'next stage'), chair: a.chair, status: 'scheduled', prep: [] });
    UI.close(); Store.save(); location.hash = '#/today'; UI.toast('Visit completed' + (nv ? ' · follow-up booked' : '')); },
  ai: el => { location.hash = '#/assistant'; runAI(el.dataset.q); },
  'ai-approve': el => { const t = db().aiTasks.find(x => x.id === el.dataset.id); t.state = 'Done'; t.stage = STEPS.length; t.result = `${t.count} message${t.count === 1 ? '' : 's'} sent (simulated) and logged.`; Store.commit(); },
  'ai-reject': el => { const t = db().aiTasks.find(x => x.id === el.dataset.id); t.state = 'Blocked'; t.result = ''; t.out = 'Discarded by you — nothing was sent.'; Store.commit(); },
  thread: el => { V.thread = el.dataset.id; db().threads.find(t => t.id === V.thread).unread = false; Store.commit(); },
  'use-draft': () => { const i = document.getElementById('reply'); i.value = 'Mild tenderness for 2–3 days after a root canal stage is common. Take the prescribed pain relief; if there is swelling or severe pain, call the clinic.'; i.focus(); },
  ref: el => { const t = db().threads.find(x => x.id === V.thread); t.msgs.push(['me', el.dataset.v === 'accept' ? 'Accepted — I’ll see him today at 14:30 and share findings.' : 'Sorry, I can’t take this referral this week.', nowHM()]); t.kind = 'Referral · ' + (el.dataset.v === 'accept' ? 'accepted' : 'declined'); Store.commit(); UI.toast('Referral ' + el.dataset.v + 'ed'); },
  avail: el => { const a = db().profile.avail; a[el.dataset.v] = !a[el.dataset.v]; Store.commit(); },
  'profile-save': () => UI.toast('Profile published (simulated) — patients see it on FMD'),
  'cp-ai': () => { const c = V.compose; c.body = `${c.title || 'Why your tooth hurts with cold drinks'}\n\nLingering pain after something cold can mean the nerve inside the tooth is inflamed. A quick exam and a small X-ray usually tell us what’s going on — and many teeth can be saved with early care.\n\nEducational content — not a diagnosis.`; c.ai = true; c.reviewed = false; render(); },
  'post-next': el => { const p = db().posts.find(x => x.id === el.dataset.id); p.status = p.status === 'Draft' ? 'Review' : 'Published'; Store.commit(); UI.toast('Post: ' + p.status); },
  'task-new': () => UI.modal('Add a to-do', `<form data-form="task" id="tk"><input class="input" name="t" required placeholder="e.g. Call lab about crown shade"></form>`, `<button class="btn" data-act="close">Cancel</button><button class="btn pri" form="tk">Add</button>`),
  cmdk: () => { UI.open(`<div class="cmdk" role="dialog" aria-modal="true" aria-label="Search"><label class="sr" for="cq">Search</label><input id="cq" placeholder="Search patients, pages, actions…" data-input="cmdk" autocomplete="off"><div class="res" id="cres">${cmdkResults('')}</div></div>`); },
};
const cmdkResults = q => { q = q.toLowerCase(); const items = [...db().patients.map(p => [p.name, 'Patient · ' + p.phone, '#/patient/' + p.id, 'user']), ...NAV.filter(n => n.length > 1).map(n => [n[1], 'Go to page', '#/' + n[0], n[2]]), ...todays().map(a => [a.time + ' · ' + P(a.patientId).name, a.title, '#/chair/' + a.id, 'play'])].filter(i => !q || (i[0] + i[1]).toLowerCase().includes(q)).slice(0, 10);
  return items.map(i => `<a href="${i[2]}" data-act="close-go">${ic(i[3], 16)}<span class="grow"><b class="small">${esc(i[0])}</b><br><span class="tiny muted">${esc(i[1])}</span></span></a>`).join('') || '<p class="small muted" style="padding:12px">No results.</p>'; };

const Forms = {
  appt: (d) => { if (db().appts.some(a => a.date === d.date && a.time === d.time)) { document.getElementById('na-err').innerHTML = '<p class="small" style="color:var(--bad)">You already have an appointment at that time.</p>'; return; } db().appts.push({ id: uid('A'), date: d.date, time: d.time, mins: +d.mins, patientId: d.patientId, kind: d.kind, title: KIND[d.kind][0], chair: 'Chair 1', status: 'scheduled', prep: [] }); UI.close(); Store.commit(); UI.toast('Booked · patient notified (simulated)'); },
  note: (d, f) => { db().notes.push({ id: uid('N'), patientId: f.dataset.id, at: now(), text: d.text, signed: false, ai: false, amendments: [] }); UI.close(); Store.commit(); },
  amend: (d, f) => { db().notes.find(n => n.id === f.dataset.id).amendments.push({ at: now(), text: d.text }); UI.close(); Store.commit(); UI.toast('Amendment added'); },
  plan: (d, f) => { const pl = db().plans[f.dataset.id] ||= { version: 0, status: 'Draft', items: [] }; pl.items.push({ t: d.t, tooth: d.tooth, fee: +d.fee, stage: pl.items.length + 1 }); pl.version++; pl.status = 'Awaiting patient'; UI.close(); Store.commit(); UI.toast('Plan v' + pl.version + ' sent to patient'); },
  ai: (d, f) => { if (!d.q) return; f.reset(); runAI(d.q); },
  reply: (d, f) => { if (!d.m) return; db().threads.find(t => t.id === V.thread).msgs.push(['me', d.m, nowHM()]); f.reset(); Store.commit(); },
  compose: (d) => { db().posts.unshift({ id: uid('C'), title: d.title, type: d.type, status: 'Draft', likes: 0, views: 0, consent: d.type === 'Case' ? V.compose.consent : null }); V.compose = null; Store.commit(); UI.toast('Saved as draft'); },
  task: d => { db().tasks.push({ id: uid('K'), t: d.t, done: false }); UI.close(); Store.commit(); },
};
const COLORS = [['blue', '● Ocean Blue'], ['teal', '● FMD Teal'], ['violet', '● Royal Violet'], ['rose', '● Rosewood'], ['graphite', '● Graphite'], ['ivory', '● Ivory & Gold'], ['stone', '● Stone & Mocha'], ['noir', '● Black & Gold', 'dark'], ['umber', '● Brown & Grey', 'dark'], ['c-neutral', '◆ Neutral', 'combo'], ['c-green', '◆ Green', 'combo'], ['c-pink', '◆ Pink & Red', 'combo'], ['c-blueneutral', '◆ Blue Neutral', 'combo'], ['c-gold', '◆ Gold', 'combo'], ['c-calm', '◆ Calm Luxury', 'combo'], ['c-deep', '◆ Deep', 'combo'], ['c-greenpink', '◆ Green & Pink', 'combo'], ['c-softblue', '◆ Soft Blue', 'combo'], ['c-minimal', '◆ Minimalist', 'combo']];
const DARK = ['noir', 'umber'];
const DARK_SIDE = ['c-neutral', 'c-green', 'c-pink', 'c-blueneutral', 'c-gold', 'c-calm', 'c-deep', 'c-greenpink', 'c-minimal'];
const COLOR_GROUPS = [['Colours', c => !c[2]], ['Dark colours', c => c[2] === 'dark'], ['Combo colour themes', c => c[2] === 'combo']];
const getColor = () => { try { const c = localStorage.getItem('fmd_dentist_color'); return COLORS.some(x => x[0] === c) ? c : 'ivory'; } catch { return 'ivory'; } };
const setColor = c => { document.documentElement.dataset.color = c; document.documentElement.dataset.tone = DARK.includes(c) ? 'dark' : 'light'; const d = document.documentElement.dataset; d.kind = c.startsWith('c-') ? 'combo' : 'single'; if (DARK_SIDE.includes(c)) d.combo = 'dark-side'; else delete d.combo; try { localStorage.setItem('fmd_dentist_color', c); } catch {} };
const getTheme = () => { try { const t = localStorage.getItem('fmd_dentist_theme'); return ['normal', 'clay', 'glass', 'bento', 'spatial', 'neu', 'glassm', 'skeu', 'mini', 'maxi'].includes(t) ? t : 'clay'; } catch { return 'clay'; } };
const setTheme = t => { document.body.dataset.theme = t; try { localStorage.setItem('fmd_dentist_theme', t); } catch {} };
const Changes = {
  'sched-filter': el => { V.sf[el.dataset.k] = el.value; render(); },
  color: el => { Guide.el && Guide.done(); setColor(el.value); render(); UI.toast(COLORS.find(c => c[0] === el.value)[1].slice(2) + ' palette on'); },
  theme: el => { Guide.el && Guide.done(); setTheme(el.value); render(); UI.toast(({ clay: 'Claymorphism', glass: 'Liquid Glass', bento: 'Bento Grid', spatial: 'Spatial', neu: 'Neumorphism', glassm: 'Glassmorphism', skeu: 'Skeuomorphism', mini: 'Minimalism', maxi: 'Maximalism' }[el.value] || 'Normal') + ' theme on'); },
  prep: (el) => { const a = A(el.dataset.id); (a.prepDone ||= {})[el.dataset.i] = el.checked; Store.save(); },
  task: el => { db().tasks.find(t => t.id === el.dataset.id).done = el.checked; Store.commit(); },
  cp: el => { V.compose[el.dataset.k] = el.value; render(); },
  'cp-rev': el => { V.compose.reviewed = el.checked; render(); },
};
const Inputs = {
  'sched-q': el => { V.sf.q = el.value; render(); },
  pq: el => { V.q = el.value; render(); },
  pf: el => { const pr = db().profile, k = el.dataset.k; pr[k] = k === 'langs' ? el.value.split(',').map(s => s.trim()).filter(Boolean) : el.value; Store.commit(); },
  cp: el => { V.compose[el.dataset.k] = el.value; },
  cmdk: el => { document.getElementById('cres').innerHTML = cmdkResults(el.value); },
};

document.addEventListener('click', e => { if (document.body.classList.contains('appear-open') && !e.target.closest('.appear,.appear-btn,#guide')) { document.body.classList.remove('appear-open'); Guide.el && requestAnimationFrame(() => Guide.draw()); } }, true);
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = Actions[el.dataset.act]; if (!fn) return; if (el.tagName !== 'A' || el.dataset.act === 'close-go') e.preventDefault(); document.body.classList.remove('nav-open'); fn(el); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); if (!f.checkValidity()) return f.reportValidity(); Forms[f.dataset.form](Object.fromEntries(new FormData(f)), f); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el) Changes[el.dataset.change](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el) Inputs[el.dataset.input](el); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Actions.cmdk(); }
  if (e.key === 'Escape') { if (Guide.el) { Guide.done(); return; } UI.close(); document.body.classList.remove('nav-open', 'appear-open'); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][tabindex]:not(button):not(a)')) { e.preventDefault(); e.target.click(); }
});
(() => { let tip; document.addEventListener('mouseover', e => { const t = e.target.closest?.('[data-tip]'); if (!t) { tip?.remove(); tip = null; return; } tip ||= Object.assign(document.createElement('div'), { className: 'tip' }); tip.textContent = t.dataset.tip; document.body.appendChild(tip); }); document.addEventListener('mousemove', e => { if (tip) { tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 12) + 'px'; tip.style.top = e.clientY - 34 + 'px'; } }); })();
window.addEventListener('scroll', () => document.getElementById('topbar')?.classList.toggle('scrolled', scrollY > 4), { passive: true });
window.addEventListener('hashchange', () => { document.body.classList.remove('nav-open', 'appear-open'); UI.close(); V.tooth = null; render(); scrollTo(0, 0); document.getElementById('main')?.focus({ preventScroll: true }); });

// Spatial theme: gaze highlight on the hovered surface, window sheen + tilt, environment parallax (mouse only; respects reduced motion)
(() => {
  let raf = 0, x = 0, y = 0, hot = null;
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const env = document.getElementById('env'), near = env?.firstElementChild;
  document.addEventListener('pointermove', e => {
    if (document.body.dataset.theme !== 'spatial' || e.pointerType !== 'mouse') return;
    x = e.clientX; y = e.clientY;
    const t = e.target.closest?.('.card,.appt,.task,.btn,.chip,.tooth,.thread');
    if (hot && hot !== t) { hot.style.removeProperty('--mx'); hot.style.removeProperty('--my'); }
    hot = t;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      if (hot) { const r = hot.getBoundingClientRect(); hot.style.setProperty('--mx', (x - r.left) + 'px'); hot.style.setProperty('--my', (y - r.top) + 'px'); }
      const win = document.querySelector('#main, .chair .split');
      if (win) { const r = win.getBoundingClientRect(); win.style.setProperty('--wx', (x - r.left) + 'px'); win.style.setProperty('--wy', (y - r.top) + 'px'); }
      if (calm.matches || innerWidth <= 900) return;
      const dx = x / innerWidth - .5, dy = y / innerHeight - .5;
      if (win) { win.style.setProperty('--ry', (dx * 2.2).toFixed(2) + 'deg'); win.style.setProperty('--rx', (-dy * 1.4).toFixed(2) + 'deg'); }
      if (env) env.style.transform = `translate3d(${(-dx * 14).toFixed(1)}px,${(-dy * 8).toFixed(1)}px,0)`;
      if (near) near.style.transform = `translate3d(${(-dx * 26).toFixed(1)}px,${(-dy * 12).toFixed(1)}px,0)`;
    });
  }, { passive: true });
  // windows ease in when you navigate
  window.addEventListener('hashchange', () => requestAnimationFrame(() => {
    if (document.body.dataset.theme !== 'spatial' || calm.matches) return;
    document.querySelector('#main, .chair .split')?.animate([{ opacity: 0, transform: 'perspective(2200px) translate3d(0,18px,-60px)' }, { opacity: 1, transform: 'perspective(2200px) translate3d(0,0,0)' }], { duration: 480, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }));
})();

/* =========================================================
   FIRST-RUN GUIDE — points new visitors at the colour + UI-design dropdowns
   ========================================================= */
const Guide = {
  KEY: 'fmd_dentist_guide_seen', el: null,
  seen() { try { return localStorage.getItem(this.KEY) === '1'; } catch { return true; } },
  start() { if (!this.el) { this.el = document.createElement('div'); this.el.id = 'guide'; this.el.setAttribute('role', 'dialog'); this.el.setAttribute('aria-label', 'Try different UI designs'); document.body.appendChild(this.el); } this.draw(); setTimeout(() => this.el?.querySelector('.guide-go')?.focus({ preventScroll: true }), 50); },
  done(msg) { try { localStorage.setItem(this.KEY, '1'); } catch {} if (!this.el) return; this.el.classList.add('out'); const el = this.el; this.el = null; setTimeout(() => el.remove(), 260); if (msg) UI.toast(msg); },
  rect(sel, root = document) { for (const e of root.querySelectorAll(sel)) { const r = e.getBoundingClientRect(); if (r.width > 4 && r.height > 4 && getComputedStyle(e).visibility !== 'hidden') return r; } return null; },
  draw() {
    if (!this.el) return;
    const vw = innerWidth, vh = innerHeight, panel = document.body.classList.contains('appear-open') ? this.rect('.appear') : null;
    const rc = this.rect('#color'), rt = this.rect('#theme'), rb = this.rect('.appear-btn');
    const holes = [], arrows = [], cards = [];
    const clampX = (x, w) => Math.max(12, Math.min(vw - w - 12, x));
    const curve = (x1, y1, x2, y2, c1, c2) => `M${x1},${y1} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${y2}`;
    const step = (n, title, text) => `<span class="guide-n">${n}</span><b>${title}</b><p>${text}</p>`;
    const btns = `<div class="guide-btns"><button class="guide-skip" data-guide="skip">Skip</button><button class="guide-go" data-guide="done">Got it, let\'s explore</button></div>`;
    if (rc && rt && !panel) {                      // desktop: both dropdowns are in the top bar
      holes.push(rc, rt);
      const base = Math.max(rc.bottom, rt.bottom), W = Math.min(280, vw - 24);
      const c1 = { x: clampX(rc.left + rc.width / 2 - W + 34, W), y: base + 96, w: W }, c2 = { x: clampX(rt.left + rt.width / 2 - 34, W), y: base + 262, w: W };
      if (c2.x < c1.x + c1.w - 40 && c2.x + W > c1.x + 40) c2.y = base + 300;
      cards.push(`<div class="guide-card" style="left:${c1.x}px;top:${c1.y}px;width:${W}px">${step(1, 'Pick a colour theme', '19 palettes — light, dark Black &amp; Gold, and five-colour <i>combo</i> themes.')}</div>`);
      cards.push(`<div class="guide-card" style="left:${c2.x}px;top:${c2.y}px;width:${W}px">${step(2, 'Switch the UI design', '10 styles: Claymorphism, Liquid Glass, Bento Grid, Spatial, Neumorphism, Skeuomorphism…')}${btns}</div>`);
      const t1 = [rc.left + rc.width / 2, rc.bottom + 10], s1 = [Math.min(c1.x + W - 30, t1[0] - 8), c1.y - 6];
      const t2 = [rt.left + rt.width / 2, rt.bottom + 10], s2 = [Math.max(c2.x + 30, t2[0] + 8), c2.y - 6];
      arrows.push({ d: curve(s1[0], s1[1], t1[0], t1[1], [s1[0] - 50, s1[1] - 46], [t1[0] - 46, t1[1] + 40]), lx: s1[0] - 118, ly: s1[1] - 46 });
      arrows.push({ d: curve(s2[0], s2[1], t2[0], t2[1], [s2[0] + 60, s2[1] - 90], [t2[0] + 52, t2[1] + 60]), lx: Math.min(t2[0] + 34, vw - 150), ly: t2[1] + 44 });
    } else if (panel && rc && rt) {               // phone/tablet: panel is open, point at both dropdowns inside it
      holes.push(rc, rt);
      const W = Math.min(330, vw - 24), cx = clampX(panel.right - W, W), cy = Math.min(panel.bottom + 74, vh - 230);
      cards.push(`<div class="guide-card" style="left:${cx}px;top:${cy}px;width:${W}px">${step('✓', 'Now choose', '<b>1</b> a colour theme and <b>2</b> a UI design — the whole app changes instantly.')}${btns}</div>`);
      const roomLeft = panel.left > 54;
      [[rc, 1], [rt, 2]].forEach(([r, i]) => {
        const sx = cx + 26 + (i - 1) * 26, sy = cy - 6;
        if (roomLeft) { const tx = r.left - 8, ty = r.top + r.height / 2; arrows.push({ d: curve(sx, sy, tx, ty, [panel.left - 36 - i * 8, sy - 20], [panel.left - 40 - i * 6, ty]), lx: i === 2 ? null : 8, ly: i === 2 ? null : ty - 34 }); }
        else { const tx = r.right - 30 - (i - 1) * 60, ty = i === 1 ? r.top + r.height / 2 : r.bottom + 6, ex = i === 1 ? panel.right + 2 : tx; arrows.push({ d: i === 1 ? curve(cx + W - 30, sy, r.right + 6, ty, [panel.right + 24, sy - 40], [panel.right + 24, ty + 6]) : curve(sx, sy, tx, ty, [sx, sy - 30], [tx, ty + 30]), lx: null }); }
      });
    } else if (rb) {                               // phone/tablet: dropdowns hide behind the palette button
      holes.push(rb);
      const W = Math.min(290, vw - 24), cx = clampX(rb.left + rb.width / 2 - W + 46, W), cy = rb.bottom + 128;
      cards.push(`<div class="guide-card" style="left:${cx}px;top:${cy}px;width:${W}px">${step('🎨', 'Try different UI designs', 'Tap the palette button to switch between 10 UI styles and 19 colour themes.')}${btns}</div>`);
      const t = [rb.left + rb.width / 2, rb.bottom + 10], st = [Math.min(cx + W - 40, t[0] - 4), cy - 6];
      arrows.push({ d: curve(st[0], st[1], t[0], t[1], [st[0] - 64, st[1] - 50], [t[0] - 58, t[1] + 46]), lx: Math.max(10, st[0] - 150), ly: st[1] - 64, label: 'tap this!' });
    } else { this.done(); return; }
    const pad = 7, mask = holes.map(r => `<rect x="${r.left - pad}" y="${r.top - pad}" width="${r.width + pad * 2}" height="${r.height + pad * 2}" rx="14" fill="#000"/>`).join('');
    const rings = holes.map(r => `<rect class="guide-ring" x="${r.left - pad}" y="${r.top - pad}" width="${r.width + pad * 2}" height="${r.height + pad * 2}" rx="14"/>`).join('');
    this.el.innerHTML = `<svg class="guide-svg" width="${vw}" height="${vh}" viewBox="0 0 ${vw} ${vh}" aria-hidden="true">
      <defs><mask id="gm"><rect width="100%" height="100%" fill="#fff"/>${mask}</mask>
      <marker id="gh" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <rect class="guide-dim" width="100%" height="100%" mask="url(#gm)"/>${rings}
      ${arrows.map((a, i) => `<path class="guide-arrow" style="animation-delay:${i * .25}s" d="${a.d}" marker-end="url(#gh)"/>${a.lx != null ? `<text class="guide-label" x="${a.lx}" y="${a.ly}" style="animation-delay:${.5 + i * .25}s">${a.label || 'click this!'}</text>` : ''}`).join('')}
    </svg>${cards.join('')}`;
  },
};
addEventListener('resize', () => Guide.el && Guide.draw());
addEventListener('scroll', () => Guide.el && Guide.draw(), { passive: true });
document.addEventListener('click', e => { const b = e.target.closest('[data-guide]'); if (!b) return; Guide.done(b.dataset.guide === 'done' ? 'Have fun — 10 UI designs × 19 colour themes to explore' : ''); });
setColor(getColor()); setTheme(getTheme()); Store.load(); render();
if (!Guide.seen()) setTimeout(() => Guide.start(), 600);
</script>
