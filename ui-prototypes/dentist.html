<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Redesigned dentist interface for FMD: today, schedule, chairside mode, patients, AI copilot, inbox, profile, content and insights. Demo data only.">
<meta name="theme-color" content="#f5f3ee">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="FMD Dentist Workspace · UI Prototype">
<meta property="og:description" content="Interactive dentist workspace prototype with 10 UI designs and 19 colour themes. Demo data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Colour palettes (html[data-color]) — applied on top of every theme ===== */
:root{--wk:1;--on-pa:#fff;--p-card:#fff;--p-ink2:#4a5263;--p-muted:#6b7282;--pa:#2f5fb3;--pa-rgb:47,95,179;--pa-2:#4a76c4;--pa-lt:#6e95d8;--pa-dk:#1f3f7a;--p-soft:#e9effa;--p-soft-rgb:233,239,250;--p-bg:#fbfaf7;--p-bg-rgb:251,250,247;--p-bg2:#f5f3ee;--p-bg2-rgb:245,243,238;--p-side:#f8f6f1;--p-ink:#1d2330;--p-ink-rgb:29,35,48;--p-line:#e8e5de;--p-line2:#dcd8cf}
html[data-color="teal"]{--pa:#0e7c80;--pa-rgb:14,124,128;--pa-2:#2a9a9e;--pa-lt:#5fbcbf;--pa-dk:#0a5b5e;--p-soft:#e1f2f1;--p-soft-rgb:225,242,241;--p-bg:#f9fbfa;--p-bg-rgb:249,251,250;--p-bg2:#eef4f2;--p-bg2-rgb:238,244,242;--p-side:#f3f7f6;--p-ink:#16282b;--p-ink-rgb:22,40,43;--p-line:#dfe8e6;--p-line2:#cfdcd9}
html[data-color="violet"]{--pa:#6243b5;--pa-rgb:98,67,181;--pa-2:#7b5fc8;--pa-lt:#a28ce0;--pa-dk:#46308a;--p-soft:#eee9fb;--p-soft-rgb:238,233,251;--p-bg:#fbfafd;--p-bg-rgb:251,250,253;--p-bg2:#f2eff8;--p-bg2-rgb:242,239,248;--p-side:#f7f5fb;--p-ink:#211c33;--p-ink-rgb:33,28,51;--p-line:#e6e1f0;--p-line2:#d6cfe6}
html[data-color="rose"]{--pa:#b03a68;--pa-rgb:176,58,104;--pa-2:#c45a83;--pa-lt:#de8eae;--pa-dk:#80264a;--p-soft:#fbe8ef;--p-soft-rgb:251,232,239;--p-bg:#fdfafb;--p-bg-rgb:253,250,251;--p-bg2:#f7eef1;--p-bg2-rgb:247,238,241;--p-side:#faf4f6;--p-ink:#2b1c24;--p-ink-rgb:43,28,36;--p-line:#eee1e6;--p-line2:#e0cfd6}
html[data-color="graphite"]{--pa:#2e3440;--pa-rgb:46,52,64;--pa-2:#4c5566;--pa-lt:#8a93a3;--pa-dk:#161a22;--p-soft:#eceef2;--p-soft-rgb:236,238,242;--p-bg:#fafafa;--p-bg-rgb:250,250,250;--p-bg2:#f2f2f3;--p-bg2-rgb:242,242,243;--p-side:#f6f6f7;--p-ink:#16181d;--p-ink-rgb:22,24,29;--p-line:#e5e6e9;--p-line2:#d4d6db}
/* Spatial's painted environment follows the palette */
html[data-color="teal"] body[data-theme="spatial"] #env{filter:hue-rotate(-38deg) saturate(.95)}
html[data-color="violet"] body[data-theme="spatial"] #env{filter:hue-rotate(35deg)}
html[data-color="rose"] body[data-theme="spatial"] #env{filter:hue-rotate(110deg) saturate(.85)}
html[data-color="graphite"] body[data-theme="spatial"] #env{filter:saturate(0) brightness(1.02)}
.color-sel{max-width:150px;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:13px;cursor:pointer}
@media (max-width:700px){.color-sel{max-width:92px;font-size:12px;padding:0 4px}}

/* Design system copied from prototype.html (FMD Clinic workspace: blue accent) */
:root{
  --bg:var(--p-bg); --bg2:var(--p-bg2); --card:var(--p-card); --ink:var(--p-ink); --ink2:var(--p-ink2); --muted:var(--p-muted); --line:var(--p-line); --line2:var(--p-line2);
  --canvas:var(--bg); --surface:var(--card); --surface-2:var(--p-bg); --ink-2:var(--ink2); --line-2:var(--line2);
  --blue:var(--pa); --blue-soft:var(--p-soft); --violet:#6243b5; --violet-soft:#efeafb;
  --teal:var(--blue); --teal-2:var(--blue); --teal-soft:var(--blue-soft); --teal-ink:var(--pa-dk); /* accent = Clinic workspace blue */
  --ok:#1f8a55; --ok-soft:#e5f4ec; --warn:#a86a00; --warn-soft:#fcf1dc; --bad:#c23b2a; --bad-soft:#fbe9e6; --info:#2f6fb8; --info-soft:#e7f0fa; --vio:var(--violet); --vio-soft:var(--violet-soft);
  --c1:#008e96; --c2:#b8790c; --c3:#3b6fc4; --c4:#b8448f;
  --r:12px; --r-sm:8px; --sh:0 1px 2px rgba(20,24,33,.05),0 2px 8px rgba(20,24,33,.04); --sh-lg:0 12px 40px rgba(20,24,33,.12);
  --serif:"Instrument Serif",Georgia,serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0;line-height:1.2;letter-spacing:-.01em} h1{font-size:28px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px} p{line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px} .mono{font-family:var(--mono);font-size:12px}
.row{display:flex;gap:12px;align-items:center} .wrap{flex-wrap:wrap} .between{justify-content:space-between} .col{display:flex;flex-direction:column;gap:12px} .grow{flex:1;min-width:0}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* demo strip + top bar */
.demo-strip{background:var(--ink);color:#d9dce3;font-size:12px;text-align:center;padding:5px 12px}
.demo-strip b{color:#fff} .demo-strip button{background:none;border:0;color:#9fe3e0;text-decoration:underline;cursor:pointer;font-size:12px}
.top{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:rgba(var(--p-bg-rgb),.88);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.ws-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 8px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:500;font-size:13px}
.ws-dot{width:10px;height:10px;border-radius:3px;background:var(--blue)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--muted);cursor:pointer;text-align:left}
.search kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;background:var(--bg2)}
.icon-btn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--bg2)}
.pip-n{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.menu-btn{display:none}
.demo{font-size:11.5px;font-weight:500;color:var(--muted);border:1px dashed var(--line2);border-radius:6px;padding:2px 8px;background:var(--p-card)}

/* layout + sidebar (prototype .layout/.side) */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:14px 10px;background:var(--p-side);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.side h6{margin:16px 10px 6px;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:13.5px;border:1px solid transparent}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--sh);border-color:var(--line)}
.nav a svg{opacity:.8} .nav .cnt{margin-left:auto;font-size:11px;background:var(--blue-soft);color:var(--blue);padding:1px 7px;border-radius:10px;font-weight:600}
.side-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--bg2);color:var(--ink2);font-size:12.5px;margin:24px 6px 0}
.content{padding:24px 28px 80px;max-width:1360px;width:100%}

/* primitives (prototype) */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px} .card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s,box-shadow .15s;text-decoration:none;color:var(--ink);font-size:14px}
.btn:hover{background:var(--bg2)} .btn:active{transform:translateY(1px)}
.btn.pri,.btn.teal{background:var(--blue);border-color:var(--blue);color:var(--on-pa)} .btn.pri:hover,.btn.teal:hover{filter:brightness(1.08);background:var(--blue)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--bg2)}
.btn.danger{color:var(--bad);border-color:#efc7c1}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px} .btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:12px}
.btn.icon{width:36px;padding:0} .btn.sm.icon{width:30px} .btn[disabled]{opacity:.5;cursor:not-allowed}
.input{width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--bg2);color:var(--ink2);border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--info-soft);color:var(--info)}
.badge.teal{background:var(--blue-soft);color:var(--blue)}.badge.vio{background:var(--violet-soft);color:var(--violet)}.badge.line{background:transparent;border-color:var(--line2)}
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.av,.av *{color:#fff}
.av.sm{width:28px;height:28px;font-size:11px}.av.lg{width:72px;height:72px;font-size:24px}.av.xl{width:104px;height:104px;font-size:34px;border:4px solid #fff;box-shadow:var(--sh)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:13px;transition:.15s;color:var(--ink)}
.chip:hover{border-color:var(--blue);color:var(--blue)} .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-pa)}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)} .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.kpi{padding:16px 18px}.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px}.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--ok)} .down{color:var(--bad)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--info-soft);color:#1d4a7a;font-size:13px}
.notice.warn{background:var(--warn-soft);color:#6d4600}.notice.bad{background:var(--bad-soft);color:#7f2318}.notice.ok{background:var(--ok-soft);color:#155c39}.notice.vio{background:var(--violet-soft);color:#3b2780}.notice.plain{background:var(--bg2);color:var(--ink2)}
.progress{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:8px;transition:width .4s}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--p-bg);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle} .tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer} .tbl tbody tr:hover{background:var(--p-bg)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px}
.hello{font-family:var(--serif);font-weight:400;font-size:clamp(36px,4.6vw,52px);line-height:1;letter-spacing:-.02em} .hello em{color:var(--blue)}
.card.hover{transition:transform .15s,box-shadow .15s,border-color .15s} .card.hover:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--line2)}

/* today timeline (prototype .tl + cards) */
.day-line{position:relative;padding-left:76px}
.day-line:before{content:"";position:absolute;left:68px;top:10px;bottom:10px;width:2px;background:var(--line)}
.slot{position:relative;display:flex;gap:14px;align-items:stretch;margin-bottom:10px}
.slot .t{position:absolute;left:-76px;top:14px;width:62px;text-align:right;font:500 12px var(--mono);color:var(--muted)}
.slot .dot{position:absolute;left:-14px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--p-card);border:2px solid var(--line2)}
.slot.now .dot{background:var(--blue);border-color:var(--blue)} .slot.done .dot{background:var(--ok);border-color:var(--ok)}
.appt{flex:1;display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:left}
.appt:hover{transform:translateY(-1px);box-shadow:var(--sh-lg);border-color:var(--line2)}
.appt.now{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)} .appt.done{opacity:.6}
.next{background:linear-gradient(160deg,#fff,var(--p-soft));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.check{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--blue)}

/* odontogram (prototype) */
.arch{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.tooth{aspect-ratio:3/4;border:1.5px solid var(--line2);border-radius:8px 8px 12px 12px;display:grid;place-items:center;font-size:10.5px;font-weight:600;cursor:pointer;background:var(--p-card);color:var(--ink2);position:relative}
.tooth:hover{border-color:var(--blue)} .tooth.sel{outline:3px solid var(--blue);outline-offset:1px}
.tooth.caries{background:#fde9e5;border-color:var(--bad)}.tooth.filled{background:#e8f0fb;border-color:var(--info)}.tooth.crown{background:#fdf3df;border-color:var(--warn)}.tooth.rct{background:#efeafb;border-color:var(--violet)}.tooth.missing{background:repeating-linear-gradient(135deg,#f3f1ec 0 4px,#e6e2d9 4px 8px);color:var(--muted)}.tooth.implant{background:#e4f4eb;border-color:var(--ok)}
.tooth .pip{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid #fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)} .legend i{border:1.5px solid;vertical-align:-2px;margin-right:5px}

/* chairside — same light system as the rest of the prototype */
.chair{background:var(--bg);min-height:100vh}
.chair-top{display:flex;align-items:center;gap:12px;padding:0 20px;height:60px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(var(--p-bg-rgb),.88);backdrop-filter:saturate(1.4) blur(10px);z-index:20}
.timer{font:600 20px var(--mono);color:var(--ink)}
.wave{display:flex;gap:3px;align-items:center;height:24px} .wave i{width:3px;border-radius:3px;background:var(--blue);animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{height:6px}50%{height:22px}}
.draft{border:1.5px dashed var(--violet);background:repeating-linear-gradient(135deg,#faf8ff 0 10px,#f4f0fd 10px 20px);border-radius:10px;padding:12px}

/* week calendar (prototype .cal + .appt colours) */
.week{display:grid;grid-template-columns:64px repeat(6,minmax(130px,1fr));border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--card);max-height:640px}
.week .hd{position:sticky;top:0;background:var(--p-bg);z-index:2;padding:10px;font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.week .hd.today{color:var(--blue)}
.week .tm{font-size:11px;color:var(--muted);padding:4px 8px;border-bottom:1px dashed var(--line);height:52px;position:sticky;left:0;background:var(--p-bg);z-index:1}
.week .cell{border-bottom:1px dashed var(--line);border-left:1px solid var(--line);height:52px;position:relative;cursor:pointer}
.week .cell:hover{background:var(--blue-soft)}
.ev{position:absolute;left:4px;right:4px;top:3px;width:calc(100% - 8px);min-height:44px;border-radius:7px;padding:4px 7px;font-size:11.5px;line-height:1.3;cursor:pointer;border:0;border-left:3px solid;overflow:hidden;z-index:1;text-align:left}
.ev.endo{background:#efeafb;border-color:var(--violet);color:#3b2780}.ev.consult{background:#e8f0fb;border-color:var(--info);color:#1d3f7a}.ev.review{background:#e4f4eb;border-color:var(--ok);color:#155c39}.ev.surgery{background:#fdf3df;border-color:var(--warn);color:#6b4500}.ev.blocked{background:repeating-linear-gradient(135deg,#f1efe9 0 6px,#e8e5dd 6px 12px);border-color:#a7a294;color:#5a5649}

/* inbox */
.inbox{display:grid;grid-template-columns:330px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--sh);min-height:580px}
.thread-list{border-right:1px solid var(--line);overflow:auto;max-height:700px}
.thread{display:flex;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left}
.thread:hover{background:var(--p-bg)} .thread[aria-current="true"]{background:var(--blue-soft)}
.thread .un{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:none}
.bubble{max-width:min(680px,80%);padding:12px 16px;border-radius:16px;line-height:1.55;font-size:14px}
.bubble.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.me{background:var(--ink);color:#fff;margin-left:auto;border-bottom-right-radius:4px}

/* profile preview */
.phone{width:320px;max-width:100%;border-radius:30px;border:9px solid var(--ink);background:var(--bg);overflow:hidden;box-shadow:var(--sh-lg)}
.phone .cover{height:110px;background:linear-gradient(120deg,#cfe9e6,#e9e4f6 60%,#f4ecdf)}
.avail{display:grid;grid-template-columns:70px repeat(6,1fr);gap:4px;font-size:11px}
.avail button{height:28px;border-radius:7px;border:1px solid var(--line2);background:var(--p-card);cursor:pointer}
.avail button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}

/* AI task cards (prototype .taskcard/.life/.risk) */
.task{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.task .th{padding:14px 16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--p-bg)}
.task .tb{padding:14px 16px;display:grid;gap:12px}
.steps{display:flex;gap:2px;flex-wrap:wrap}
.steps span{font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--bg2);color:var(--muted);font-weight:500}
.steps span.done{background:var(--ok-soft);color:var(--ok)} .steps span.now{background:var(--blue);color:var(--on-pa)} .steps span.stop{background:var(--warn-soft);color:var(--warn)} .steps span.fail{background:var(--bad-soft);color:var(--bad)}
.risk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px}
.risk.read{background:#eef0f3;color:#3c4453}.risk.draft{background:var(--info-soft);color:var(--info)}.risk.external{background:var(--warn-soft);color:var(--warn)}.risk.clinical{background:#2a2f3a;color:#fff}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible} .chart text{font:11px var(--sans);fill:var(--muted)} .chart .gl{stroke:#ece9e2}
.legd{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px} .legd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;box-shadow:var(--sh-lg);white-space:nowrap}

/* overlays (prototype drawer/modal/toast/cmdk) */
.scrim{position:fixed;inset:0;background:rgba(20,24,33,.32);z-index:90;animation:fadeIn .18s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:91;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slideIn .22s cubic-bezier(.2,.8,.2,1)}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-b{padding:20px 22px;overflow:auto;flex:1} .drawer-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--p-bg)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--card);border-radius:18px;z-index:92;box-shadow:var(--sh-lg);animation:pop .18s ease-out}
.modal-h{padding:20px 22px 0}.modal-b{padding:16px 22px}.modal-f{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.cmdk{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(640px,calc(100% - 32px));background:var(--card);border-radius:16px;z-index:95;box-shadow:var(--sh-lg);overflow:hidden;animation:pop2 .15s}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;outline:none}
.cmdk .res{max-height:52vh;overflow:auto;padding:6px}
.cmdk a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink)} .cmdk a:hover,.cmdk a:focus{background:var(--bg2);outline:none}
.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--sh-lg);display:flex;gap:10px;align-items:flex-start;animation:toastIn .25s cubic-bezier(.2,.8,.2,1);font-size:13.5px}
.toast.ok{background:#14532d}.toast.bad{background:#7f1d1d}.toast.warn{background:#6b4500}
@keyframes fadeIn{from{opacity:0}} @keyframes slideIn{from{transform:translateX(40px);opacity:0}} @keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}} @keyframes pop2{from{opacity:0;transform:translateX(-50%) scale(.98)}} @keyframes toastIn{from{transform:translateY(12px);opacity:0}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* responsive (prototype breakpoints) */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:900px){

  .g3{grid-template-columns:repeat(2,minmax(0,1fr))} .inbox{grid-template-columns:1fr}.thread-list{max-height:260px;border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:700px){
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .top{padding:0 12px;gap:6px}.brand-text,.ws-label,.search span,.search kbd,.hide-sm{display:none}
  .search{flex:0 0 36px;padding:0;justify-content:center}

body[data-theme="glass"]{
  --bg:var(--p-bg); --bg2:rgba(255,255,255,calc(.42 * var(--wk))); --card:rgba(255,255,255,calc(.55 * var(--wk))); --surface:rgba(255,255,255,calc(.55 * var(--wk))); --surface-2:rgba(255,255,255,calc(.35 * var(--wk)));

  --rim:inset 0 1px 0 rgba(255,255,255,calc(.95 * var(--wk))),inset 0 -1px 0 rgba(255,255,255,calc(.25 * var(--wk))),inset 1px 0 0 rgba(255,255,255,calc(.35 * var(--wk))),inset -1px 0 0 rgba(255,255,255,calc(.2 * var(--wk)));
  --sh:var(--rim),0 8px 28px rgba(var(--p-ink-rgb),.1),0 1px 2px rgba(var(--p-ink-rgb),.05);

  --ok-soft:rgba(31,138,85,.13); --warn-soft:rgba(168,106,0,.13); --bad-soft:rgba(194,59,42,.11); --info-soft:rgba(47,111,184,.12);

/* ===== Maximalism theme (body[data-theme="maxi"]) — patterns, the full Normal palette, ink outlines, display type ===== */
body[data-theme="maxi"]{
  --bw:2.5px; --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink); --hard-lg:9px 9px 0 var(--ink);
  --sh:var(--hard); --sh-lg:var(--hard-lg); --r:18px; --line:var(--p-ink); --line2:var(--p-ink);
  --p-blue:var(--p-soft); --p-amber:var(--mx-amber,#fcf1dc); --p-violet:var(--mx-lilac,#efeafb); --p-green:#e5f4ec; --p-rose:#fbe9e6;
  background-color:var(--p-bg);
  background-image:
    radial-gradient(circle at 92% 8%,var(--mx-amber,#fcf1dc) 0 90px,transparent 91px),
    radial-gradient(circle at 92% 8%,transparent 0 110px,var(--mx-pop,#b8448f) 111px 114px,transparent 115px),

/* ===== Schedule — BookMyShow-style layout (uses theme tokens) ===== */
.bms{margin:-8px -28px 0}
.bms-head{padding:22px 28px 18px}
.bms-head h1{font-size:30px;font-weight:600;letter-spacing:-.01em}
.bms-chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border:1px solid var(--ink2);border-radius:999px;font-size:12px;color:var(--ink2)}
.bms-bar{display:flex;align-items:stretch;justify-content:space-between;gap:12px;background:var(--card);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);box-shadow:0 2px 6px rgba(var(--p-ink-rgb),.06);padding:0 28px;overflow-x:auto;scrollbar-width:none}
.bms-dates{display:flex;align-items:center;gap:4px;padding:8px 0}
.bms-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:54px;height:68px;border:0;border-radius:10px;background:transparent;cursor:pointer;color:var(--ink);line-height:1.15;font-size:11.5px;text-transform:uppercase}
.bms-date span{color:var(--ink2);font-weight:500}
.bms-date b{font-size:18px;font-weight:700;margin:2px 0}
.bms-date:hover:not(.on):not([disabled]){background:var(--bg2)}
.bms-date.dim span,.bms-date.dim b{color:var(--muted);font-weight:500}
.bms-date[disabled]{opacity:.38;cursor:not-allowed}
.bms-date.on{background:var(--pa);color:var(--on-pa)} .bms-date.on span,.bms-date.on b{color:var(--on-pa)}
.bms-nav{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:none}
.bms-filters{display:flex;align-items:stretch}
.bms-dd{position:relative;display:flex;align-items:center;gap:5px;padding:0 14px;border-left:1px solid var(--line2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.bms-dd select{field-sizing:content;max-width:150px;appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:13px;color:var(--ink);cursor:pointer;padding:0;outline:none}
.bms-dd select option{color:var(--p-ink);background:var(--p-card)}
.bms-dd svg{color:var(--pa);pointer-events:none}
.bms-dd.on{border-bottom-color:var(--pa)} .bms-dd.on select{font-weight:600}
.bms-dd:focus-within{background:var(--bg2)}
.bms-search{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--line2)}
.bms-search button{border:0;background:none;color:var(--ink2);cursor:pointer;display:grid;place-items:center;width:34px;height:34px;border-radius:8px}
.bms-search button:hover{background:var(--bg2)}
.bms-search input{border:0;border-bottom:1px solid var(--line2);background:transparent;width:150px;height:30px;outline:none;font-size:13px;color:var(--ink)}
.bms-legend{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 28px;font-size:11.5px;color:var(--ink2);background:var(--card);border-bottom:1px solid var(--line)}
.bms-legend > .row:last-child{font-size:10.5px;letter-spacing:.04em;color:var(--muted)}
.bms-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.lg-ok{background:var(--ok)} .lg-warn{background:var(--warn)} .lg-free{background:transparent;border:1.5px dashed var(--muted)}
.bms-x{width:22px;height:22px;border-radius:50%;border:0;background:var(--bg2);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.bms-list{margin:16px 28px 0;border-radius:4px;overflow:hidden;padding:0}
.bms-row{padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.bms-row:last-child{border-bottom:0}
.bms-rh{display:flex;gap:12px;align-items:flex-start}
.bms-rh h3{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.bms-rh p{font-size:11.5px;color:var(--muted);margin-top:4px}
.bms-i{color:var(--muted);display:inline-grid;cursor:help}
.bms-logo{width:36px;height:36px;border:1px solid var(--line2);border-radius:6px;display:grid;place-items:center;position:relative;color:var(--pa);flex:none;background:var(--card)}
.bms-logo b{position:absolute;right:-6px;bottom:-6px;font-size:9px;background:var(--pa);color:var(--on-pa);border-radius:4px;padding:1px 3px;line-height:1.2}
.bms-add{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.bms-add:hover{background:var(--bg2);color:var(--pa)}
.bms-tags{display:flex;gap:8px;margin:12px 0 0 48px}
.bms-tags:empty{display:none}
.bms-tag{width:26px;height:26px;border-radius:5px;display:grid;place-items:center}
.bms-tag.k-endo{background:var(--violet-soft);color:var(--violet)} .bms-tag.k-consult{background:var(--info-soft);color:var(--info)} .bms-tag.k-review{background:var(--ok-soft);color:var(--ok)} .bms-tag.k-surgery{background:var(--warn-soft);color:var(--warn)}
.bms-slots{display:flex;flex-wrap:wrap;gap:12px 16px;margin:14px 0 0}
.bslot{width:108px;min-height:42px;padding:5px 6px 5px 9px;border:1px solid var(--ok);border-left:4px solid var(--ok);border-radius:2px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink2);transition:background .15s,transform .1s}
.bslot b{font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.bslot small{font-size:8.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bslot:hover:not([disabled]){background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.bslot.warn{border-color:var(--warn)} .bslot.warn:hover{background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.bslot.bad{border-color:var(--bad)}
.bslot.done{border-color:var(--line2);opacity:.6}
.bslot.blk{border-color:var(--line2);background:repeating-linear-gradient(135deg,var(--card) 0 6px,var(--bg2) 6px 12px);cursor:default}
.bslot.free{border:1px dashed var(--muted);border-left:4px solid var(--line2)}
.bslot.free b{color:var(--muted)}
.bslot.free:hover{border-color:var(--pa);border-left-color:var(--pa);background:color-mix(in srgb,var(--pa) 7%,var(--card))} .bslot.free:hover b{color:var(--pa)}
body[data-theme="bento"] .bms{margin:0}body[data-theme="bento"] .bms-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;border-bottom:0}body[data-theme="bento"] .bms-bar,body[data-theme="bento"] .bms-legend{border-left:1px solid var(--line);border-right:1px solid var(--line)}body[data-theme="bento"] .bms-legend{border-radius:0 0 var(--r) var(--r)}body[data-theme="bento"] .bms-list{margin:12px 0 0}
body[data-theme="mini"] .bms{margin:0}body[data-theme="mini"] .bms-head{padding-left:0}
@media (min-width:901px) and (max-width:1250px){.bms-bar{flex-wrap:wrap}.bms-filters{border-top:1px solid var(--line);width:100%}.bms-dd:first-child{border-left:0;padding-left:0}.bms-search{margin-left:auto}}
@media (max-width:900px){.bms{margin:-8px -16px 0}.bms-head,.bms-legend{padding-left:16px;padding-right:16px}.bms-bar{flex-direction:column;padding:0 16px;gap:0}.bms-dates{overflow-x:auto}.bms-filters{overflow-x:auto;border-top:1px solid var(--line)}.bms-dd:first-child{border-left:0;padding-left:0}.bms-list{margin:12px 16px 0}}
@media (max-width:640px){.bms-head h1{font-size:24px}.bms-date{width:48px;height:60px}.bms-tags{margin-left:0}.bslot{width:calc(50% - 8px)}.bms-legend > .row:first-child{display:none!important}}
/* ===== Schedule × theme skins ===== */
.bslot{--sc:var(--ok)} .bslot.warn{--sc:var(--warn)} .bslot.bad{--sc:var(--bad)} .bslot.done,.bslot.blk{--sc:var(--line2)} .bslot.free{--sc:var(--muted)}

/* ---- CLAYMORPHISM ---- */

.guide-dim{fill:rgba(12,14,22,.52)}
.guide-ring{fill:none;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 10px rgba(255,255,255,.8));animation:guidePulse 1.6s ease-in-out infinite}
.guide-arrow{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 7;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));animation:guideDraw .9s ease-out both,guideFlow 1s linear .9s infinite}
.guide-label{fill:#fff;font:italic 400 30px var(--serif,Georgia);paint-order:stroke;stroke:rgba(12,14,22,.35);stroke-width:4px;opacity:0;animation:guidePop .4s ease-out forwards}
.guide-card{position:absolute;pointer-events:auto;background:#fffdf8;color:#1d2330;border-radius:18px;padding:16px 18px 14px 56px;box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05);font:14px/1.45 var(--sans,system-ui);animation:guideIn .45s cubic-bezier(.2,.8,.2,1) both}
.guide-card+.guide-card{animation-delay:.2s}
.guide-card b{display:block;font-size:15.5px;letter-spacing:-.01em;margin-bottom:3px}
.guide-card p{margin:0;color:#4a5263;font-size:13px}
.guide-card p b{display:inline;font-size:13px;margin:0;color:#1d2330}
.guide-n{position:absolute;left:16px;top:15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d2b46a,#8a681b);color:#fff;font-weight:800;font-size:13.5px;box-shadow:0 4px 10px rgba(138,104,27,.4)}
.guide-btns{display:flex;justify-content:flex-end;gap:8px;margin:12px 0 0 -38px}
.guide-btns button{white-space:nowrap;font:600 13px var(--sans,system-ui);height:34px;padding:0 14px;border-radius:10px;cursor:pointer;border:0}
.guide-skip{background:transparent;color:#6b7282}
.guide-skip:hover{background:#f2efe8}
.guide-go{background:#1d2330;color:#fff;box-shadow:0 6px 16px rgba(29,35,48,.3)}
.guide-go:hover{background:#2c3446}
.guide-go:focus-visible,.guide-skip:focus-visible{outline:3px solid #d2b46a;outline-offset:2px}
@keyframes guidePulse{0%,100%{stroke-opacity:1;stroke-width:3}50%{stroke-opacity:.55;stroke-width:5}}
@keyframes guideDraw{from{stroke-dashoffset:160;opacity:0}to{stroke-dashoffset:0;opacity:1}}
@keyframes guideFlow{to{stroke-dashoffset:-26}}
@keyframes guidePop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes guideIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.guide-arrow,.guide-ring,.guide-card,.guide-label{animation:none!important;opacity:1}}
@media (max-width:420px){.guide-label{font-size:24px}.guide-card{padding:14px 14px 12px 50px}.guide-n{left:13px}}
</style>

    return `<svg class="chart" viewBox="0 0 ${W} ${h + 22}" role="img" aria-label="${esc(label)}">${[0, .5, 1].map(f => `<line class="gl" x1="${L}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${L - 6}" y="${y(max * f) + 4}" text-anchor="end">${fmtv(Math.round(max * f))}</text>`).join('')}
      ${labels.map((l, i) => `<text x="${x(i)}" y="${h + 15}" text-anchor="middle">${esc(l)}</text>`).join('')}
      ${series.map(s => `<path d="${s.v.map((v, i) => (i ? 'L' : 'M') + x(i) + ',' + y(v)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>${s.v.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="10" fill="transparent" data-tip="${esc(s.n)} · ${esc(labels[i])}: ${esc(fmtv(v))}"/>`).join('')}<circle cx="${x(s.v.length - 1)}" cy="${y(s.v.at(-1))}" r="4" fill="${s.c}" stroke="#fff" stroke-width="2"/>`).join('')}</svg>
      ${series.length > 1 ? `<div class="legd">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : ''}`;
  },
};
</script>
<script>
/* =========================================================
   VIEWS
   ========================================================= */
const V = { tabs: {}, tooth: null, thread: 'T1', q: '', chair: {}, aiLog: [] };
const tab = (g, d) => V.tabs[g] ?? d;
const tabs = (g, items, cur) => `<div class="tabs" role="tablist">${items.map(i => `<button class="tab" role="tab" aria-selected="${i === cur}" data-act="tab" data-g="${g}" data-v="${i}">${i}</button>`).join('')}</div>`;
const seg = (g, items, cur) => `<div class="seg" role="group">${items.map(i => `<button aria-pressed="${i === cur}" data-act="tab" data-g="${g}" data-v="${i}">${i}</button>`).join('')}</div>`;
const ph = (title, sub, actions = '') => `<div class="ph"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="row wrap">${actions}</div></div>`;
const todays = () => db().appts.filter(a => a.date === TODAY && a.patientId).sort((a, b) => a.time.localeCompare(b.time));
const currentAppt = () => { const n = nowHM(), list = todays().filter(a => !['done', 'no-show'].includes(a.status)); return list.find(a => a.status === 'in-chair') || list.find(a => addMin(a.time, a.mins) > n) || list[0]; };

const NAV = [
  ['Practice'], ['today', 'Today', 'sun'], ['schedule', 'Schedule', 'cal'], ['patients', 'Patients', 'users'], ['assistant', 'AI copilot', 'spark'], ['inbox', 'Inbox', 'inbox', () => db().threads.filter(t => t.unread).length || ''],
  ['Presence'], ['profile', 'Public profile', 'user'], ['content', 'Content studio', 'edit'],
  ['Practice health'], ['insights', 'Insights', 'chart'], ['settings', 'Settings', 'gear'],
];
const Shell = (page, body) => `<header class="top" id="topbar"><button class="icon-btn menu-btn" data-act="nav" aria-label="Open navigation">${ic('menu')}</button>
  <a class="brand" href="#/today" aria-label="FMD home">${LOGO(32)}<span class="brand-text">FindMyDentist<small>Clinic OS · Dentist workspace</small></span></a>
  <span class="ws-btn"><span class="ws-dot" aria-hidden="true"></span><span class="ws-label">FMD Clinic</span></span>
  <button class="search" data-act="cmdk" aria-label="Search (Ctrl+K)">${ic('search', 16)}<span>Search patients, pages, actions…</span><kbd>Ctrl K</kbd></button>
  <span class="grow"></span>
  <button class="icon-btn appear-btn" data-act="appear" aria-label="Appearance: colour and theme" aria-expanded="false">${ic('palette')}</button><span class="appear" role="group" aria-label="Appearance"><label class="sr" for="color">Colour palette</label><select class="color-sel theme-sel" id="color" data-change="color" aria-label="Colour palette">${COLOR_GROUPS.map(([g, f]) => `<optgroup label="${g}">${COLORS.filter(f).map(([k, n]) => `<option value="${k}" ${getColor() === k ? 'selected' : ''}>${n}</option>`).join('')}</optgroup>`).join('')}</select><label class="sr" for="theme">UI theme</label><select class="theme-sel" id="theme" data-change="theme" aria-label="UI theme"><option value="normal" ${getTheme() === 'normal' ? 'selected' : ''}>Normal</option><option value="clay" ${getTheme() === 'clay' ? 'selected' : ''}>Claymorphism</option><option value="glass" ${getTheme() === 'glass' ? 'selected' : ''}>Liquid Glass</option><option value="bento" ${getTheme() === 'bento' ? 'selected' : ''}>Bento Grid</option><option value="spatial" ${getTheme() === 'spatial' ? 'selected' : ''}>Spatial</option><option value="neu" ${getTheme() === 'neu' ? 'selected' : ''}>Neumorphism</option><option value="glassm" ${getTheme() === 'glassm' ? 'selected' : ''}>Glassmorphism</option><option value="skeu" ${getTheme() === 'skeu' ? 'selected' : ''}>Skeuomorphism</option><option value="mini" ${getTheme() === 'mini' ? 'selected' : ''}>Minimalism</option><option value="maxi" ${getTheme() === 'maxi' ? 'selected' : ''}>Maximalism</option></select></span>
  ${currentAppt() ? `<a class="btn sm teal hide-sm" href="#/chair/${currentAppt().id}">${ic('play', 14)} Chairside</a>` : ''}
  <a class="icon-btn" href="#/inbox" aria-label="Inbox${db().threads.filter(t => t.unread).length ? ', ' + db().threads.filter(t => t.unread).length + ' unread' : ''}">${ic('bell')}${db().threads.filter(t => t.unread).length ? `<span class="pip-n">${db().threads.filter(t => t.unread).length}</span>` : ''}</a>
  <span class="av sm" style="background:#1f2b3d" title="Dr. Ishaan Mehta">IM</span></header>
<div class="app"><nav class="side" aria-label="Dentist workspace">
  <div class="nav">${NAV.map(n => n.length === 1 ? `<h6>${n[0]}</h6>` : `<a href="#/${n[0]}" ${page === n[0] ? 'aria-current="page"' : ''}>${ic(n[2], 17)}<span>${n[1]}</span>${n[3] && n[3]() ? `<span class="cnt">${n[3]()}</span>` : ''}</a>`).join('')}</div>
  <div class="side-note">${ic('alert', 16)}<span>Prototype: demo data, simulated AI and integrations.</span></div>
</nav><div class="nav-scrim" data-act="nav" aria-hidden="true"></div><main class="content" id="main" data-route="${route().p || 'today'}" tabindex="-1">${body}</main></div>
<nav class="bottombar" aria-label="Quick navigation">${[['today', 'Today', 'sun'], ['schedule', 'Schedule', 'cal'], ['patients', 'Patients', 'users'], ['assistant', 'AI', 'spark'], ['inbox', 'Inbox', 'inbox']].map(([k, l, i]) => `<a href="#/${k}" ${page === k ? 'aria-current="page"' : ''}>${ic(i, 20)}<span>${l}</span>${k === 'inbox' && db().threads.filter(t => t.unread).length ? `<i class="bb-dot" aria-label="unread"></i>` : ''}</a>`).join('')}</nav>`;

/* ---------- TODAY ---------- */
const Today = () => {
  const list = todays(), cur = currentAppt(), done = list.filter(a => a.status === 'done').length, n = nowHM();
  const p = cur && P(cur.patientId), h = new Date().getHours();
  const unsigned = db().notes.filter(x => !x.signed).length, unread = db().threads.filter(t => t.unread).length;
  return `<div class="row between wrap hello-row" style="margin:18px 0 24px;align-items:flex-end"><div><p class="eyebrow">${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })}</p><h1 class="hello mt8">Good ${h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'}, <em>Ishaan.</em></h1><p class="muted mt8">${list.length} patients today · ${done} done · ${list.filter(a => a.kind === 'endo').length} root canals · first break at 13:00</p></div>
    <div class="row"><a class="btn" href="#/schedule">${ic('cal', 16)} Week</a><button class="btn pri" data-act="new-appt">${ic('plus', 16)} Add appointment</button></div></div>
  <div class="grid split" style="grid-template-columns:minmax(0,1fr) 380px;align-items:start">
    <section aria-label="Today's schedule"><div class="row between" style="margin-bottom:12px"><h2>Your day</h2>${UI_progress(done / Math.max(1, list.length))}</div>
      <div class="day-line">${db().appts.filter(a => a.date === TODAY).sort((a, b) => a.time.localeCompare(b.time)).map(a => {
        if (a.status === 'blocked') return `<div class="slot"><span class="t">${a.time}</span><span class="dot"></span><div class="appt" style="background:repeating-linear-gradient(135deg,#f6f4ef 0 8px,#efece5 8px 16px);cursor:default"><span class="muted small">${ic('clock', 15)} ${esc(a.title)} · ${a.mins} min</span></div></div>`;
        const pt = P(a.patientId), isNow = cur && a.id === cur.id;
        return `<div class="slot ${isNow ? 'now' : ''} ${a.status === 'done' ? 'done' : ''}"><span class="t">${a.time}</span><span class="dot"></span><button class="appt ${isNow ? 'now' : ''} ${a.status === 'done' ? 'done' : ''}" data-act="appt" data-id="${a.id}">${av(pt.name, pt.hue)}<span class="grow"><b>${esc(pt.name)}</b> <span class="muted small">· ${pt.age}${pt.sex}</span><br><span class="small">${esc(a.title)}</span></span>
          <span class="col" style="gap:6px;align-items:flex-end">${badge(KIND[a.kind][0], KIND[a.kind][1])}${stBadge(a.status)}</span>${pt.alerts.length ? `<span title="${esc(pt.alerts.join(', '))}" style="color:var(--bad)">${ic('alert', 17)}</span>` : ''}</button></div>`;
      }).join('')}</div></section>
    <aside class="col" style="gap:16px">
      ${cur ? `<div class="next"><p class="eyebrow">${cur.status === 'in-chair' ? 'In chair now' : cur.time <= n ? 'Up now' : 'Up next · ' + cur.time}</p><div class="row mt12">${av(p.name, p.hue, 'lg')}<div><h2>${esc(p.name)}</h2><p class="muted small">${esc(cur.title)} · ${cur.chair} · ${cur.mins} min</p></div></div>
        ${p.alerts.length ? `<div class="mt12 row wrap">${p.alerts.map(x => `<span class="badge bad">${ic('alert', 12)} ${esc(x)}</span>`).join('')}</div>` : ''}${p.note ? `<p class="small muted mt12">“${esc(p.note)}”</p>` : ''}
        <div class="mt16"><p class="eyebrow">Prep</p>${cur.prep.map((x, i) => `<label class="check"><input type="checkbox" data-change="prep" data-id="${cur.id}" data-i="${i}" ${cur.prepDone?.[i] ? 'checked' : ''}> <span class="small">${esc(x)}</span></label>`).join('')}</div>
        <div class="row mt16 wrap">${cur.status === 'scheduled' ? `<button class="btn" data-act="status" data-id="${cur.id}" data-v="arrived">Mark arrived</button>` : ''}<a class="btn teal" href="#/chair/${cur.id}">${ic('play', 14)} Start chairside</a><a class="btn" href="#/patient/${p.id}">Open chart</a></div></div>` : `<div class="card pad">${'<div class="empty"><h3>All done for today</h3><p class="small">Nice work.</p></div>'}</div>`}
      <div class="card pad"><div class="row between"><h3>${ic('spark', 16, 'style="color:var(--blue);vertical-align:-3px"')} Morning brief</h3><span class="badge vio">AI · draft</span></div>
        <ul class="small brief" style="padding-left:18px;margin:10px 0 0"><li><b>Kabir Iyer</b> (09:00) is diabetic — last fasting sugar 132. Ask before obturation.</li><li><b>Rohan Reddy</b> (15:30) takes aspirin — confirm with physician note before extraction.</li><li><b>Nisha Desai</b> is pregnant — avoid elective radiographs.</li><li>${unread} unread messages, incl. a referral from Dr. Tara Mathew.</li></ul>
        <p class="tiny muted mt8">Summarised from records. Clinical decisions remain yours.</p></div>
      <div class="card pad"><div class="row between"><h3>To do</h3><button class="btn sm ghost" data-act="task-new">${ic('plus', 14)} Add</button></div>
        ${unsigned ? `<a class="notice warn mt12 small" href="#/patients" style="text-decoration:none">${ic('edit', 15)} ${unsigned} note${unsigned > 1 ? 's' : ''} waiting for your signature</a>` : ''}
        <div class="mt8">${db().tasks.map(t => `<label class="check"><input type="checkbox" data-change="task" data-id="${t.id}" ${t.done ? 'checked' : ''}><span class="small" style="${t.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.t)}</span></label>`).join('')}</div></div>
    </aside></div>`;
};
const UI_progress = f => `<div class="row" style="width:180px"><div class="progress grow" role="progressbar" aria-valuenow="${Math.round(f * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="Day progress"><i style="width:${f * 100}%"></i></div><span class="tiny muted">${Math.round(f * 100)}%</span></div>`;

/* ---------- SCHEDULE ---------- */
const Schedule = () => {
  const sf = V.sf ||= { kind: '', chair: '', status: '', time: '', sort: 'time', q: '', tip: true };
  const off = V.weekOff || 0, days = Array.from({ length: 7 }, (_, i) => day(i + off * 7));
  const sel = days.includes(V.sDay) ? V.sDay : (days.find(d => new Date(d + 'T00:00').getDay() !== 0) || days[0]); V.sDay = sel;
  const has = d => db().appts.some(a => a.date === d && a.patientId);
  const t12 = t => { const [h, m] = t.split(':').map(Number); return `${pad(((h + 11) % 12) + 1)}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
  const band = t => +t.slice(0, 2) < 12 ? 'Morning' : +t.slice(0, 2) < 16 ? 'Afternoon' : 'Evening';
  const all = db().appts.filter(a => a.date === sel);
  const chairs = [...new Set(['Chair 1', 'Chair 2', ...all.filter(a => a.chair !== '—').map(a => a.chair)])].filter(c => !sf.chair || c === sf.chair);
  const tone = a => a.status === 'blocked' ? 'blk' : a.status === 'done' ? 'done' : a.status === 'no-show' ? 'bad' : P(a.patientId)?.alerts.length ? 'warn' : 'ok';
  const match = a => (!sf.kind || a.kind === sf.kind) && (!sf.status || a.status === sf.status) && (!sf.time || band(a.time) === sf.time) && (!sf.q || (P(a.patientId)?.name || '').toLowerCase().includes(sf.q.toLowerCase()));
  const busy = (c, s) => all.some(a => (a.chair === c || a.chair === '—') && addMin(a.time, -29) <= s && s < addMin(a.time, a.mins));
  const freeFor = c => ['09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00', '17:00', '18:00'].filter(s => !busy(c, s) && (!sf.time || band(s) === sf.time) && !sf.kind && !sf.status && !sf.q && (sel > TODAY || (sel === TODAY && s > nowHM())));
  const rows = chairs.map(c => {
    const list = all.filter(a => (a.chair === c || (a.chair === '—' && !sf.kind && !sf.status && !sf.q)) && match(a)), free = freeFor(c);
    const slots = [...list.map(a => ({ t: a.time, a })), ...free.map(t => ({ t }))].sort((x, y) => x.t.localeCompare(y.t));
    return { c, list, free, slots, n: list.filter(a => a.patientId).length };
  }).filter(r => r.slots.length || !(sf.kind || sf.status || sf.q || sf.time)).sort((x, y) => sf.sort === 'busy' ? y.n - x.n : sf.sort === 'free' ? y.free.length - x.free.length : x.c.localeCompare(y.c));
  const kinds = [...new Set(all.filter(a => a.patientId).map(a => a.kind))];
  const dd = (k, label, opts) => `<label class="bms-dd ${sf[k] && k !== 'sort' ? 'on' : ''}"><span class="sr">${label}</span><select data-change="sched-filter" data-k="${k}" aria-label="${label}">${opts.map(([v, n]) => `<option value="${v}" ${sf[k] === v ? 'selected' : ''}>${n}</option>`).join('')}</select>${ic('down', 14)}</label>`;
  return `<section class="bms" aria-label="Schedule">
  <header class="bms-head"><h1>Schedule</h1><div class="row wrap" style="gap:8px;margin-top:10px">${['Lumen Dental Studio', 'Dr. Ishaan Mehta', 'Endodontics', `${chairs.length} chairs`, 'Mon–Sat · 9:00–19:00'].map(x => `<span class="bms-chip">${x}</span>`).join('')}</div></header>
  <div class="bms-bar">
    <div class="bms-dates" role="tablist" aria-label="Choose a day">${off > 0 ? `<button class="bms-nav" data-act="week" data-v="-1" aria-label="Previous week">${ic('back', 16)}</button>` : ''}${days.map(d => { const x = new Date(d + 'T00:00'), closed = x.getDay() === 0, on = d === sel; return `<button class="bms-date ${on ? 'on' : ''} ${!has(d) ? 'dim' : ''}" role="tab" aria-selected="${on}" data-act="sched-day" data-v="${d}" ${closed ? 'disabled title="Clinic closed"' : ''}><span>${x.toLocaleDateString('en-IN', { weekday: 'short' }).toUpperCase()}</span><b>${pad(x.getDate())}</b><span>${x.toLocaleDateString('en-IN', { month: 'short' }).toUpperCase()}</span></button>`; }).join('')}<button class="bms-nav" data-act="week" data-v="1" aria-label="Next week">${ic('chev', 16)}</button></div>
    <div class="bms-filters">${dd('kind', 'Appointment type', [['', 'All types'], ...Object.entries(KIND).filter(k => k[0] !== 'blocked').map(([k, v]) => [k, v[0]])])}${dd('chair', 'Chair', [['', 'All chairs'], ['Chair 1', 'Chair 1'], ['Chair 2', 'Chair 2']])}${dd('status', 'Status', [['', 'Any status'], ['scheduled', 'Scheduled'], ['arrived', 'Arrived'], ['done', 'Completed'], ['no-show', 'No-show']])}${dd('time', 'Preferred time', [['', 'Preferred time'], ['Morning', 'Morning'], ['Afternoon', 'Afternoon'], ['Evening', 'Evening']])}${dd('sort', 'Sort by', [['time', 'Sort: Chair'], ['busy', 'Sort: Busiest'], ['free', 'Sort: Most free']])}
      <div class="bms-search ${sf.open || sf.q ? 'open' : ''}">${sf.open || sf.q ? `<input id="sched-q" placeholder="Find patient…" value="${esc(sf.q)}" data-input="sched-q" aria-label="Find patient">` : ''}<button data-act="sched-search" aria-label="Search patients">${ic('search', 19)}</button></div></div>
  </div>
  <div class="bms-legend">${sf.tip ? `<span class="row" style="gap:8px">${ic('alert', 14, 'style="color:var(--warn)"')}<span>indicates a medical alert on the patient — check before treatment</span><button class="bms-x" data-act="sched-tip" aria-label="Dismiss">${ic('x', 13)}</button></span>` : '<span></span>'}<span class="row" style="gap:16px"><span><i class="lg-ok"></i>BOOKED</span><span><i class="lg-warn"></i>NEEDS ATTENTION</span><span><i class="lg-free"></i>FREE SLOT</span></span></div>
  <div class="bms-list card">${rows.map(r => `<article class="bms-row"><div class="bms-rh"><span class="bms-logo">${ic('tooth', 20)}<b>${r.c.replace('Chair ', 'C')}</b></span><div class="grow"><h3>${r.c}: Lumen Dental Studio, Indiranagar <span class="bms-i" title="${r.n} patients · ${r.free.length} free slots">${ic('help', 15)}</span></h3><p>${r.n ? `${r.n} appointment${r.n > 1 ? 's' : ''}` : 'No appointments'} · ${r.free.length ? `${r.free.length} free slot${r.free.length > 1 ? 's' : ''}` : 'fully booked'}</p></div><button class="bms-add" data-act="new-appt" data-d="${sel}" title="Add appointment on ${r.c}" aria-label="Add appointment on ${r.c}">${ic('plus', 18)}</button></div>
      <div class="bms-tags">${[...new Set(r.list.filter(a => a.patientId).map(a => a.kind))].map(k => `<span class="bms-tag k-${k}" title="${KIND[k][0]}">${ic({ endo: 'tooth', consult: 'chat', review: 'check', surgery: 'alert' }[k] || 'tooth', 15)}</span>`).join('')}</div>
      <div class="bms-slots">${r.slots.map(({ t, a }) => a ? `<button class="bslot ${tone(a)}" data-act="appt" data-id="${a.id}" ${a.patientId ? '' : 'disabled'} title="${esc(a.patientId ? P(a.patientId).name + ' · ' + a.title + ' · ' + STATUS[a.status][0] : a.title)}"><b>${t12(t)}${a.patientId && P(a.patientId).alerts.length ? ' ⚠' : ''}</b><small>${esc(a.patientId ? P(a.patientId).name.split(' ')[0] + ' · ' + (KIND[a.kind][0]) : 'Lunch / blocked')}</small></button>` : `<button class="bslot free" data-act="new-appt" data-d="${sel}" data-t="${t}" title="Book ${t12(t)} on ${r.c}"><b>${t12(t)}</b><small>Free · book</small></button>`).join('') || '<p class="muted small">Nothing matches these filters.</p>'}</div></article>`).join('') || `<div class="empty"><h3>No chairs match these filters</h3><button class="btn mt12" data-act="sched-reset">Clear filters</button></div>`}</div>
  ${kinds.length ? '' : `<p class="muted small" style="margin-top:12px">No appointments on ${dLabel(sel)} yet — tap a free slot to book.</p>`}
</section>`;
};

/* ---------- PATIENTS ---------- */
const Patients = () => {
  const q = (V.q || '').toLowerCase(), f = tab('pf', 'All');
  const list = db().patients.filter(p => (!q || (p.name + p.phone).toLowerCase().includes(q)) && (f === 'All' || (f === 'Today' && todays().some(a => a.patientId === p.id)) || (f === 'Alerts' && p.alerts.length) || (f === 'Unsigned notes' && db().notes.some(n => n.patientId === p.id && !n.signed))));
  return `${ph('Patients', `${db().patients.length} patients under your care`)}
  <div class="row wrap" style="margin-bottom:16px"><input class="input" id="pq" style="max-width:340px" placeholder="Search by name or phone" value="${esc(V.q)}" data-input="pq" aria-label="Search patients">${['All', 'Today', 'Alerts', 'Unsigned notes'].map(x => `<button class="chip" aria-pressed="${x === f}" data-act="tab" data-g="pf" data-v="${x}">${x}</button>`).join('')}</div>
  <div class="grid g3">${list.map(p => { const nx = db().appts.filter(a => a.patientId === p.id && a.date >= TODAY && a.status !== 'done').sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0]; return `<a class="card pad" href="#/patient/${p.id}" style="text-decoration:none;color:inherit;transition:box-shadow .15s" onmouseover="this.style.boxShadow='var(--sh-lg)'" onmouseout="this.style.boxShadow=''"><div class="row">${av(p.name, p.hue, 'lg')}<div class="grow"><b style="font-size:15px">${esc(p.name)}</b><div class="small muted">${p.age} · ${p.sex === 'M' ? 'Male' : 'Female'} · ${p.phone}</div></div></div>
    <div class="row wrap mt12">${p.alerts.map(x => badge(x, 'bad')).join('')}${Object.keys(p.chart).length ? badge(Object.keys(p.chart).length + ' charted teeth', 'line') : badge('No findings', 'line')}${p.balance ? badge('Due ' + fmt(p.balance), 'warn') : ''}</div>
    <div class="row between mt12 small"><span class="muted">Last visit ${dLabel(p.lastVisit)}</span>${nx ? `<span class="badge teal">Next ${nx.date === TODAY ? 'today ' + nx.time : dLabel(nx.date)}</span>` : ''}</div></a>`; }).join('') || '<div class="empty">No patients match.</div>'}</div>`;
};

const Patient = id => {
  const p = P(id); if (!p) return '<div class="empty">Patient not found.</div>';
  const t = tab('pt', 'Chart'), notes = db().notes.filter(n => n.patientId === id).sort((a, b) => b.at.localeCompare(a.at)), plan = db().plans[id], appts = db().appts.filter(a => a.patientId === id).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  const body = {
    Chart: `<div class="grid split" style="grid-template-columns:minmax(0,1fr) 300px;align-items:start"><div class="card pad">${odonto(p, V.tooth)}</div><div class="card pad">${V.tooth ? `<h3>Tooth ${V.tooth}</h3><p class="small muted mt4">Currently: <b>${p.chart[V.tooth] || 'sound'}</b></p><div class="row wrap mt12">${COND.map(([k, l]) => `<button class="chip" aria-pressed="${(p.chart[V.tooth] || 'sound') === k}" data-act="cond" data-id="${id}" data-v="${k}">${l}</button>`).join('')}</div><h4 class="mt16 small">History</h4>${p.history.filter(h => h.tooth === V.tooth).reverse().map(h => `<p class="tiny mt4">${h.at.replace('T', ' ')} · ${h.from} → <b>${h.to}</b></p>`).join('') || '<p class="tiny muted mt4">No changes recorded.</p>'}<p class="tiny muted mt12">Charting appends history — earlier findings are never overwritten.</p>` : `<div class="empty">${ic('tooth', 30)}<p class="small mt8">Select a tooth to chart findings.</p></div>`}</div></div>`,
    Notes: `<div class="row between"><h3>Clinical notes</h3><div class="row"><button class="btn sm" data-act="note-new" data-id="${id}">${ic('plus', 14)} Note</button></div></div><div class="col mt12">${notes.map(noteCard).join('') || '<div class="empty">No notes yet.</div>'}</div>`,
    'Treatment plan': plan ? `<div class="card"><div class="card-h"><h3>Plan v${plan.version}</h3>${badge(plan.status, plan.status === 'Acknowledged' ? 'ok' : 'warn')}</div><table class="tbl"><thead><tr><th>Stage</th><th>Treatment</th><th>Tooth</th><th class="num">Fee</th></tr></thead><tbody>${plan.items.map(i => `<tr><td>${i.stage}</td><td>${esc(i.t)}</td><td>${i.tooth}</td><td class="num">${fmt(i.fee)}</td></tr>`).join('')}<tr><td colspan="3"><b>Estimate</b></td><td class="num"><b>${fmt(plan.items.reduce((a, i) => a + i.fee, 0))}</b></td></tr></tbody></table><div class="pad row between" style="border-top:1px solid var(--line)"><span class="small muted">Patient sees this in their FMD app.</span><button class="btn sm" data-act="plan-add" data-id="${id}">${ic('plus', 14)} Add item</button></div></div>` : `<div class="empty">No plan yet.<div class="mt12"><button class="btn pri" data-act="plan-add" data-id="${id}">Start a plan</button></div></div>`,
    Imaging: `<div class="grid g3">${['IOPA — ' + (Object.keys(p.chart)[0] || '36'), 'OPG full mouth', 'Bitewing — left'].map((x, i) => `<div class="card" style="overflow:hidden"><div role="img" aria-label="${x} (illustration)" style="aspect-ratio:4/3;background:radial-gradient(ellipse at 50% 60%,#5d6573,#11151b 72%);display:grid;place-items:center"><svg width="62%" viewBox="0 0 200 80" aria-hidden="true">${[0,1,2,3].map(j => `<path d="M${25 + j * 42} 10c-10 0-14 10-12 24 2 12 4 30 9 38 3 4 6 0 7-8 1-6 3-10 7-10s6 4 7 10c1 8 4 12 7 8 5-8 7-26 9-38 2-14-2-24-12-24-6 0-8 3-11 3s-5-3-11-3z" fill="rgba(230,235,245,${.35 + j * .12})"/>`).join('')}</svg></div><div class="pad" style="padding:12px 14px"><b class="small">${x}</b><p class="tiny muted">${dLabel(day(-(i * 40 + 5)))} · demo image</p></div></div>`).join('')}</div>`,
    Visits: `<div class="card"><table class="tbl"><thead><tr><th>Date</th><th>Time</th><th>Visit</th><th>Status</th></tr></thead><tbody>${appts.map(a => `<tr class="click" data-act="appt" data-id="${a.id}"><td>${dLabel(a.date)}</td><td class="mono">${a.time}</td><td>${esc(a.title)}</td><td>${stBadge(a.status)}</td></tr>`).join('')}${db().visits.filter(v => v.patientId === id).map(v => `<tr><td>${dLabel(v.date)}</td><td class="mono">—</td><td>${esc(v.summary)}</td><td>${badge('Visit summary', 'teal')}</td></tr>`).join('')}</tbody></table></div>`,
  };
  const nx = appts.find(a => a.date >= TODAY && a.status !== 'done');
  return `<nav class="small muted" style="margin-top:14px"><a href="#/patients" style="color:var(--muted)">Patients</a> / ${esc(p.name)}</nav>
  <div class="card pad mt12" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${av(p.name, p.hue, 'xl')}<div class="grow"><h1 class="serif" style="font-size:38px;font-weight:400">${esc(p.name)}</h1><p class="muted">${p.age} yrs · ${p.sex === 'M' ? 'Male' : 'Female'} · ${p.phone} · last visit ${dLabel(p.lastVisit)}</p><div class="row wrap mt8">${p.alerts.map(x => badge('⚠ ' + x, 'bad')).join('') || badge('No medical alerts', 'ok')}${p.note ? badge(p.note, 'line') : ''}</div></div>
    <div class="row wrap">${nx ? `<a class="btn teal" href="#/chair/${nx.id}">${ic('play', 14)} ${nx.date === TODAY ? 'Start ' + nx.time + ' visit' : 'Next ' + dLabel(nx.date)}</a>` : ''}<button class="btn" data-act="new-appt" data-p="${id}">${ic('cal', 15)} Book</button><button class="btn" data-act="ai-explain" data-id="${id}">${ic('spark', 15)} Explain to patient</button></div></div>
  <div class="mt16">${tabs('pt', ['Chart', 'Notes', 'Treatment plan', 'Imaging', 'Visits'], t)}</div><div class="mt16">${body[t]}</div>`;
};
const noteCard = n => `<div class="${n.ai && !n.signed ? 'draft' : 'card pad'}"><div class="row between wrap"><span class="small"><b>${n.ai ? 'AI scribe draft' : 'Dr. Ishaan Mehta'}</b> · ${n.at.replace('T', ' ')}</span><span class="row">${n.ai ? badge(n.accepted ? 'AI · accepted' : 'AI draft · review needed', n.accepted ? 'vio' : 'warn') : ''}${n.signed ? badge('Signed', 'ok') : badge('Unsigned', 'line')}</span></div>
  <p class="mt8" style="white-space:pre-wrap">${esc(n.text)}</p>${n.amendments.map(a => `<div class="notice plain mt8 small"><div><b>Amendment · ${a.at.replace('T', ' ')}</b><br>${esc(a.text)}</div></div>`).join('')}
  <div class="row mt12">${n.ai && !n.accepted ? `<button class="btn sm teal" data-act="note-accept" data-id="${n.id}">Review & accept</button>` : ''}${!n.signed ? `<button class="btn sm pri" data-act="note-sign" data-id="${n.id}" ${n.ai && !n.accepted ? 'disabled title="Accept the AI draft first"' : ''}>Sign</button>` : `<button class="btn sm" data-act="note-amend" data-id="${n.id}">Amend</button>`}</div></div>`;

/* ---------- CHAIRSIDE ---------- */
const Chair = id => {
  const a = A(id); if (!a || !a.patientId) return Shell('today', '<div class="empty">Appointment not found.</div>');
  const p = P(a.patientId), c = V.chair[id] ||= { start: null, tooth: null, procs: [], transcript: '', recording: false, rx: [] };
  const draft = db().notes.find(n => n.chairId === id);
  const PROCS = { endo: ['Access opening', 'Working length', 'Cleaning & shaping', 'Obturation', 'Temporary restoration'], consult: ['Examination', 'IOPA radiograph', 'Vitality test', 'Treatment discussion'], review: ['Clinical review', 'Occlusion check', 'Polish'], surgery: ['LA administered', 'Extraction', 'Haemostasis achieved', 'Post-op instructions'] }[a.kind] || [];
  return `<div class="chair"><header class="chair-top"><a class="btn sm" href="#/today">${ic('back', 15)} Exit</a>${av(p.name, p.hue)}<div class="grow"><b style="font-size:16px">${esc(p.name)}</b> <span class="muted small">· ${p.age}${p.sex} · ${esc(a.title)} · ${a.chair}</span></div>
    ${p.alerts.map(x => `<span class="badge bad">⚠ ${esc(x)}</span>`).join('')}<button class="icon-btn appear-btn" data-act="appear" aria-label="Appearance: colour and theme" aria-expanded="false">${ic('palette')}</button><span class="appear" role="group" aria-label="Appearance"><label class="sr" for="color">Colour palette</label><select class="color-sel theme-sel" id="color" data-change="color" aria-label="Colour palette">${COLOR_GROUPS.map(([g, f]) => `<optgroup label="${g}">${COLORS.filter(f).map(([k, n]) => `<option value="${k}" ${getColor() === k ? 'selected' : ''}>${n}</option>`).join('')}</optgroup>`).join('')}</select><label class="sr" for="theme">UI theme</label><select class="theme-sel" id="theme" data-change="theme" aria-label="UI theme"><option value="normal" ${getTheme() === 'normal' ? 'selected' : ''}>Normal</option><option value="clay" ${getTheme() === 'clay' ? 'selected' : ''}>Claymorphism</option><option value="glass" ${getTheme() === 'glass' ? 'selected' : ''}>Liquid Glass</option><option value="bento" ${getTheme() === 'bento' ? 'selected' : ''}>Bento Grid</option><option value="spatial" ${getTheme() === 'spatial' ? 'selected' : ''}>Spatial</option><option value="neu" ${getTheme() === 'neu' ? 'selected' : ''}>Neumorphism</option><option value="glassm" ${getTheme() === 'glassm' ? 'selected' : ''}>Glassmorphism</option><option value="skeu" ${getTheme() === 'skeu' ? 'selected' : ''}>Skeuomorphism</option><option value="mini" ${getTheme() === 'mini' ? 'selected' : ''}>Minimalism</option><option value="maxi" ${getTheme() === 'maxi' ? 'selected' : ''}>Maximalism</option></select></span><span class="timer" id="chair-timer" aria-label="Visit timer">${c.start ? '' : '00:00'}</span>${c.start ? '' : `<button class="btn teal" data-act="chair-start" data-id="${id}">${ic('play', 14)} Start visit</button>`}</header>
  <div style="padding:20px 24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px" class="split">
    <div class="col" style="gap:18px"><div class="card pad"><div class="row between"><h3>Chart</h3><span class="small muted">Tap a tooth, then a finding</span></div><div class="mt12">${odonto(p, c.tooth, 'chair-tooth')}</div>
      ${c.tooth ? `<div class="row wrap mt16">${COND.map(([k, l]) => `<button class="chip" aria-pressed="${(p.chart[c.tooth] || 'sound') === k}" data-act="chair-cond" data-id="${id}" data-v="${k}">${c.tooth}: ${l}</button>`).join('')}</div>` : ''}</div>
      <div class="card pad"><h3>Procedure checklist</h3><div class="row wrap mt12">${PROCS.map(x => `<button class="chip" aria-pressed="${c.procs.includes(x)}" data-act="chair-proc" data-id="${id}" data-v="${esc(x)}">${c.procs.includes(x) ? '✓ ' : ''}${esc(x)}</button>`).join('')}</div></div>
      <div class="card pad"><div class="row between"><h3>Prescription</h3><span class="tiny muted">You prescribe — AI never does</span></div><div class="row wrap mt12">${['Ibuprofen 400 mg · SOS · 3 days', 'Paracetamol 650 mg · SOS · 3 days', 'Chlorhexidine 0.2% rinse · BD · 7 days'].map(x => `<button class="chip" aria-pressed="${c.rx.includes(x)}" data-act="chair-rx" data-id="${id}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>${p.alerts.some(x => /penicillin/i.test(x)) ? `<div class="notice plain mt12 small">${ic('alert', 15)} Penicillin allergy on file — amoxicillin hidden from quick picks.</div>` : ''}</div></div>
    <div class="col" style="gap:18px"><div class="card pad"><div class="row between"><h3>AI scribe</h3>${c.recording ? `<span class="wave" aria-label="Listening">${[0,1,2,3,4,5].map(i => `<i style="animation-delay:${i * .12}s"></i>`).join('')}</span>` : badge('Simulated', 'vio')}</div>
        <p class="small muted mt8">Listens chairside and drafts the note. Nothing is saved until you accept and sign.</p>
        <div class="notice plain mt12 small" style="min-height:90px;white-space:pre-wrap" aria-live="polite">${esc(c.transcript) || '<span class="muted">Transcript appears here…</span>'}</div>
        <div class="row mt12">${c.recording ? `<button class="btn" data-act="scribe-stop" data-id="${id}">Stop</button>` : `<button class="btn" data-act="scribe" data-id="${id}">${ic('mic', 15)} ${c.transcript ? 'Resume' : 'Start'} listening</button>`}<button class="btn teal" data-act="scribe-draft" data-id="${id}" ${c.transcript && !c.recording ? '' : 'disabled'}>${ic('spark', 15)} Draft note</button></div></div>
      ${draft ? `<div class="card pad"><h3>Visit note</h3><div class="mt12">${noteCard(draft)}</div></div>` : ''}
      <div class="card pad"><h3>Wrap up</h3><p class="small muted mt4">${c.procs.length} procedures · ${p.history.filter(h => h.at.startsWith(TODAY)).length} chart updates · ${c.rx.length} Rx</p><button class="btn teal lg mt12" style="width:100%" data-act="chair-finish" data-id="${id}" ${a.status === 'done' ? 'disabled' : ''}>${a.status === 'done' ? '✓ Visit completed' : 'Complete visit'}</button></div></div>
  </div></div>`;
};

/* ---------- AI COPILOT ---------- */
const STEPS = ['Understand', 'Plan', 'Check permission', 'Preview', 'Run', 'Verify', 'Log'];
const AI_PROMPTS = ['Summarise my day', 'Draft follow-up messages for today’s RCT patients', 'Explain root canal treatment to Aarav in simple words', 'Which patients have overdue recalls?', 'What should I prescribe Aarav?', 'Prepare my referral reply to Dr. Tara Mathew'];
const Assistant = () => `${ph(`${ic('spark', 24, 'style="color:var(--teal);vertical-align:-3px"')} AI copilot`, 'Prepares work for you. Messages need your approval; clinical decisions stay yours.')}
  <div class="grid split" style="grid-template-columns:minmax(0,1fr) 300px;align-items:start"><div class="col">
    <form class="card pad" data-form="ai"><label class="f">What do you need?<div class="row"><input class="input" id="aiq" name="q" placeholder="e.g. Draft follow-up messages for today’s RCT patients" autocomplete="off"><button class="btn pri">Run</button></div></label><div class="row wrap mt12">${AI_PROMPTS.map(x => `<button type="button" class="chip" data-act="ai" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div></form>
    ${db().aiTasks.map(taskCard).join('') || `<div class="card pad empty">${ic('spark', 30)}<p class="mt8">Ask for something above. Tasks appear here with their plan, risk level and approval.</p></div>`}
  </div><aside class="col"><div class="card pad"><h3>How approvals work</h3>${[['read', 'Read-only', 'Runs instantly'], ['draft', 'Draft', 'You review before use'], ['external', 'Messages patients', 'Needs your approval'], ['clinical', 'Clinical decision', 'Never done by AI']].map(r => `<div class="mt12"><span class="risk ${r[0]}">${r[1]}</span><p class="tiny muted mt4">${r[2]}</p></div>`).join('')}</div><div class="notice vio small">${ic('lock', 15)}<span>The copilot only sees patients under your care at Lumen Dental Studio.</span></div></aside></div>`;
const taskCard = t => { const st = i => i < t.stage ? 'done' : i === t.stage ? (t.state === 'Needs approval' ? 'stop' : t.state === 'Blocked' ? 'fail' : t.state === 'Done' ? 'done' : 'now') : ''; return `<article class="task"><div class="th"><div><div class="row wrap"><span class="risk ${t.risk}">${{ read: 'Read-only', draft: 'Draft', external: 'Messages patients', clinical: 'Clinical' }[t.risk]}</span>${badge(t.state, { Done: 'ok', 'Needs approval': 'warn', Blocked: 'bad' }[t.state] || 'teal')}</div><p class="mt8"><b>“${esc(t.q)}”</b></p></div><span class="tiny muted">${t.time}</span></div>
  <div class="tb"><div class="steps">${STEPS.map((s, i) => `<span class="${st(i)}">${s}</span>`).join('')}</div>${t.state === 'Running' ? '<span class="typing" aria-label="Working"><span></span><span></span><span></span></span>' : ''}
  ${t.out ? `<div class="${t.risk === 'clinical' ? 'notice bad' : t.risk === 'draft' || t.risk === 'external' ? 'draft' : 'notice plain'} small" style="white-space:pre-wrap">${esc(t.out)}</div>` : ''}
  ${t.state === 'Needs approval' ? `<div class="row"><button class="btn sm" data-act="ai-reject" data-id="${t.id}">Discard</button><button class="btn sm teal" data-act="ai-approve" data-id="${t.id}">Approve & send</button></div>` : ''}${t.result ? `<div class="notice ok small">${ic('check', 15)} ${esc(t.result)}</div>` : ''}</div></article>`; };

/* ---------- INBOX ---------- */
const Inbox = () => { const th = db().threads.find(t => t.id === V.thread) || db().threads[0]; return `${ph('Inbox', 'Patients, referrals, labs and your clinic — in one place')}
  <div class="inbox"><div class="thread-list" role="list">${db().threads.map(t => `<button class="thread" role="listitem" aria-current="${t.id === th.id}" data-act="thread" data-id="${t.id}">${t.unread ? '<span class="un" aria-label="Unread"></span>' : '<span style="width:8px;flex:none"></span>'}<span class="grow"><span class="row between"><b class="small">${esc(t.from)}</b><span class="tiny muted">${t.msgs.at(-1)[2]}</span></span><span class="small" style="display:block">${esc(t.subject)}</span><span class="row mt4">${badge(t.kind, { Patient: 'teal', Referral: 'vio', Lab: 'warn', Clinic: 'info' }[t.kind])}</span></span></button>`).join('')}</div>
  <section class="col" style="padding:20px;gap:14px"><div class="row between wrap"><div><h2>${esc(th.subject)}</h2><p class="small muted">${esc(th.from)} · ${th.kind}</p></div>${th.kind === 'Referral' ? `<div class="row"><button class="btn sm" data-act="ref" data-v="decline">Decline</button><button class="btn sm teal" data-act="ref" data-v="accept">Accept referral</button></div>` : ''}</div>
    <div class="col grow" style="gap:10px">${th.msgs.map(m => `<div class="bubble ${m[0]}">${esc(m[1])}<div class="tiny" style="opacity:.6;margin-top:4px">${m[2]}</div></div>`).join('')}</div>
    ${th.kind === 'Patient' ? `<div class="notice plain small">${ic('spark', 15)} <span class="grow">Suggested reply (AI draft): “Mild tenderness for 2–3 days after a root canal stage is common. Take the prescribed pain relief; if there is swelling or severe pain, call the clinic.”</span><button class="btn sm" data-act="use-draft">Use</button></div>` : ''}
    <form class="row" data-form="reply"><label class="sr" for="reply">Reply</label><input class="input" id="reply" name="m" placeholder="Write a reply…" autocomplete="off"><button class="btn pri">${ic('send', 15)} Send</button></form></section></div>`; };

/* ---------- PROFILE ---------- */
const Profile = () => { const pr = db().profile; return `${ph('Public profile', 'This is how patients see you on FMD. Changes preview live.', `<button class="btn teal" data-act="profile-save">Publish changes</button>`)}
  <div class="grid split" style="grid-template-columns:minmax(0,1fr) 340px;align-items:start"><div class="col">
    <div class="card pad grid g2"><label class="f">Display name<input class="input" id="pf-name" value="${esc(pr.name)}" data-input="pf" data-k="name"></label><label class="f">Title<input class="input" id="pf-title" value="${esc(pr.title)}" data-input="pf" data-k="title"></label><label class="f" style="grid-column:1/-1">Qualifications<input class="input" id="pf-q" value="${esc(pr.quals)}" data-input="pf" data-k="quals"></label><label class="f" style="grid-column:1/-1">Bio<textarea class="input" id="pf-bio" data-input="pf" data-k="bio" maxlength="280">${esc(pr.bio)}</textarea><span class="tiny muted" style="font-weight:400">${pr.bio.length}/280 · avoid unverifiable claims like “best dentist”.</span></label><label class="f">Consultation fee (₹)<input class="input" type="number" id="pf-fee" value="${pr.fee}" data-input="pf" data-k="fee"></label><label class="f">Languages<input class="input" id="pf-lang" value="${esc(pr.langs.join(', '))}" data-input="pf" data-k="langs"></label></div>
    <div class="card pad"><div class="row between"><h3>Availability on FMD</h3><span class="small muted">Tap to toggle</span></div><div class="avail mt12"><span></span>${['Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<b class="tiny" style="text-align:center">${d}</b>`).join('')}${['Morning','Afternoon','Evening'].map(s => `<span class="tiny muted" style="align-self:center">${s}</span>${['Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<button aria-pressed="${!!pr.avail[d + s]}" data-act="avail" data-v="${d + s}" aria-label="${d} ${s}"></button>`).join('')}`).join('')}</div></div>
    <div class="card pad"><h3>Verification</h3><div class="row wrap mt12">${badge('✓ Dental council registration', 'ok')}${badge('✓ MDS certificate', 'ok')}${badge('✓ Clinic affiliation', 'ok')}</div><p class="tiny muted mt8">Verification is simulated in this prototype.</p></div></div>
  <div style="position:sticky;top:90px"><div class="phone"><div class="cover"></div><div style="padding:0 16px 18px;margin-top:-34px">${av(pr.name, '#0e7c80', 'xl')}<h2 class="serif mt8" style="font-size:26px;font-weight:400">${esc(pr.name)}</h2><p class="small muted">${esc(pr.title)} · ${esc(pr.quals)}</p><div class="row wrap mt8">${badge('✓ Verified', 'ok')}${badge('★ 4.9 · 212', 'line')}</div><p class="small mt12">${esc(pr.bio)}</p><p class="tiny muted mt8">${esc(pr.clinic)} · ${esc(pr.langs.join(', '))}</p><div class="row wrap mt12">${pr.services.map(s => badge(s, 'line')).join('')}</div><button class="btn teal mt16" style="width:100%" tabindex="-1">Book · ${fmt(+pr.fee || 0)}</button></div></div><p class="tiny muted mt8" style="text-align:center">Live preview · FMD app</p></div></div>`; };

/* ---------- CONTENT ---------- */
const Content = () => { const c = V.compose ||= { title: '', type: 'Education', consent: '', body: '', reviewed: false }; return `${ph('Content studio', 'Educate patients on FMD. Case posts require documented consent.')}
