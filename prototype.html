<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMD — FindMyDentist · Interactive Prototype</title>
<meta name="description" content="FMD ecosystem prototype: Main, Concierge, Clinic OS, Clinic AI Manager, Scholar, Admin and Accountant. Demo data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — mirror web/src/app/globals.css (warm white, charcoal, teal)
   ============================================================ */
:root{
  --bg:#fbfaf7; --bg2:#f5f3ee; --card:#fff; --ink:#1d2330; --ink2:#4a5263; --muted:#6b7282;
  --line:#e8e5de; --line2:#dcd8cf;
  --teal:#0e7c80; --teal-ink:#0a5e61; --teal-soft:#e6f3f2;
  --blue:#2f5fb3; --blue-soft:#e9effa;
  --violet:#6243b5; --violet-soft:#efeafb;
  --char:#262c38;
  --ok:#1f8a55; --ok-soft:#e5f4ec; --warn:#a86a00; --warn-soft:#fcf1dc; --bad:#c23b2a; --bad-soft:#fbe9e6; --info:#2f6fb8; --info-soft:#e7f0fa;
  --c1:#008e96; --c2:#b8790c; --c3:#3b6fc4; --c4:#b8448f; /* validated categorical palette (light) */
  --accent:var(--teal); --accent-soft:var(--teal-soft);
  --r:12px; --r-sm:8px; --r-lg:18px;
  --sh:0 1px 2px rgba(20,24,33,.05),0 2px 8px rgba(20,24,33,.04);
  --sh-lg:0 12px 40px rgba(20,24,33,.12);
  --serif:"Instrument Serif",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
body[data-ws="clinic"]{--accent:var(--blue);--accent-soft:var(--blue-soft)}
body[data-ws="scholar"]{--accent:var(--violet);--accent-soft:var(--violet-soft)}
body[data-ws="admin"]{--accent:var(--char);--accent-soft:#eceef2}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:fixed;left:8px;top:-60px;z-index:999;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px}
.skip:focus{top:8px}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px} .mono{font-family:var(--mono);font-size:12px}
.row{display:flex;gap:12px;align-items:center} .row.wrap{flex-wrap:wrap} .between{justify-content:space-between} .col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0} .gap4{gap:4px}.gap8{gap:8px}.gap16{gap:16px}.gap24{gap:24px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s,box-shadow .15s;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--bg2)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.danger{color:var(--bad);border-color:#efc7c1}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:12px}
.btn.icon{width:36px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:13px}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
.err-msg{color:var(--bad);font-size:12.5px}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:20px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}

/* ---------- cards, badges ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:18px}.card.pad-lg{padding:24px}
.card.hover{transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.card.hover:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--line2)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-b{padding:16px 18px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--bg2);color:var(--ink2);border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--info-soft);color:var(--info)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}.badge.outline{background:transparent;border-color:var(--line2)}
.badge.spons{background:#fff6e0;color:#8a5a00;border-color:#f0d9a0}
.badge.demo{background:#fff;border:1px dashed var(--line2);color:var(--muted);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.avatar.lg{width:72px;height:72px;font-size:24px}.avatar.xl{width:104px;height:104px;font-size:34px;border:4px solid #fff;box-shadow:var(--sh)}
.avatar.sm{width:28px;height:28px;font-size:11px}
.kpi{padding:16px 18px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
.progress{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .4s}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--info-soft);color:#1d4a7a;font-size:13px}
.notice.warn{background:var(--warn-soft);color:#6d4600}.notice.bad{background:var(--bad-soft);color:#7f2318}.notice.ok{background:var(--ok-soft);color:#155c39}.notice.neutral{background:var(--bg2);color:var(--ink2)}
.notice b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:13px;transition:.15s;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line);background:#fcfbf9;white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover{background:#fbfaf6}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--sh);color:var(--ink)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-hero{background:radial-gradient(1200px 600px at -10% -20%,#d9efed 0,transparent 60%),radial-gradient(700px 500px at 120% 120%,#e8e3f7 0,transparent 55%),var(--bg2);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.login-hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5vw,64px);line-height:.98;letter-spacing:-.02em;max-width:560px}
.login-side{padding:48px 56px;overflow:auto}
.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.role-card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:.15s}
.role-card:hover{border-color:var(--teal);box-shadow:var(--sh-lg);transform:translateY(-1px)}
.role-card .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);flex:none}
.eco{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.eco span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.7);border:1px solid var(--line);font-size:12.5px}

/* ---------- app shell ---------- */
.top{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:rgba(251,250,247,.88);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.ws-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 8px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:500;font-size:13px}
.ws-dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.search-btn{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--muted);cursor:pointer;text-align:left}
.search-btn kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;background:var(--bg2)}
.icon-btn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--bg2)}
.icon-btn.menu-btn{display:none}
.pip{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.mainnav{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:30}
.mainnav a{padding:11px 12px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.mainnav a:hover{color:var(--ink)}
.mainnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:14px 10px;background:#f8f6f1;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.side h6{margin:16px 10px 6px;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:13.5px}
.side a:hover{background:var(--bg2);color:var(--ink)}
.side a[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--sh);border:1px solid var(--line)}
.side a .cnt{margin-left:auto;font-size:11px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:10px;font-weight:600}
.side svg{opacity:.8}
.content{padding:24px 28px 80px;max-width:1360px;width:100%}
.main-content{padding:24px 20px 96px;max-width:1180px;margin:0 auto}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h p{color:var(--muted);margin-top:4px}
.crumbs{display:flex;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--ink)}
.bottomnav{display:none}
.demo-strip{background:var(--ink);color:#d9dce3;font-size:12px;text-align:center;padding:5px 12px}
.demo-strip b{color:#fff}
.demo-strip button{background:none;border:0;color:#9fe3e0;text-decoration:underline;cursor:pointer;font-size:12px}

/* ---------- popovers, drawer, modal, toast ---------- */
.pop{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);min-width:260px;padding:6px;animation:fadeIn .14s ease-out}
.pop .item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.pop .item:hover,.pop .item:focus-visible{background:var(--bg2)}
.scrim{position:fixed;inset:0;background:rgba(20,24,33,.32);z-index:90;animation:fadeIn .18s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:91;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slideIn .22s cubic-bezier(.2,.8,.2,1)}
.drawer.wide{width:min(860px,100%)}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-b{padding:20px 22px;overflow:auto;flex:1}
.drawer-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fcfbf9}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--card);border-radius:18px;z-index:92;box-shadow:var(--sh-lg);animation:pop .18s ease-out}
.modal.wide{width:min(820px,calc(100% - 32px))}
.modal-h{padding:20px 22px 0}.modal-b{padding:16px 22px}.modal-f{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--sh-lg);display:flex;gap:10px;align-items:flex-start;animation:toastIn .25s cubic-bezier(.2,.8,.2,1);font-size:13.5px}
.toast.ok{background:#14532d}.toast.bad{background:#7f1d1d}.toast.warn{background:#6b4500}
.cmdk{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(640px,calc(100% - 32px));background:var(--card);border-radius:16px;z-index:95;box-shadow:var(--sh-lg);overflow:hidden;animation:pop .15s}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;outline:none}
.cmdk .res{max-height:52vh;overflow:auto;padding:6px}
.cmdk .grp{padding:8px 12px 4px;font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1}}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,124,128,.35)}70%{box-shadow:0 0 0 10px rgba(14,124,128,0)}100%{box-shadow:0 0 0 0 rgba(14,124,128,0)}}
.skel{background:linear-gradient(90deg,#f0eee8 0,#f8f7f3 50%,#f0eee8 100%);background-size:800px 100%;animation:shimmer 1.2s infinite linear;border-radius:8px;height:14px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
.spinner{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ill{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.empty h4{color:var(--ink);margin-bottom:4px}

/* ---------- FMD Main ---------- */
.hero{padding:44px 0 28px;text-align:center}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,5.4vw,60px);line-height:1;letter-spacing:-.02em}
.hero h1 em{color:var(--teal)}
.ask{max-width:720px;margin:24px auto 0;background:var(--card);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--sh-lg);padding:8px 8px 8px 18px;display:flex;align-items:center;gap:6px}
.ask input{flex:1;border:0;outline:none;height:48px;font-size:16px;background:none;min-width:0}
.ask:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft),var(--sh-lg)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.section{margin-top:40px}
.section-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:12px}
.section-h h2{font-family:var(--serif);font-weight:400;font-size:28px}
.doc-card{padding:16px;display:flex;gap:14px}
.doc-card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stars{color:#c88a00;letter-spacing:1px}
.profile-cover{height:180px;border-radius:18px;background:linear-gradient(120deg,#cfe9e6,#e9e4f6 60%,#f4ecdf)}
.profile-head{display:flex;gap:20px;align-items:flex-end;margin-top:-52px;padding:0 24px;flex-wrap:wrap}
.slot{height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:13px;font-weight:500}
.slot:hover{border-color:var(--teal)}.slot[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.slot[disabled]{text-decoration:line-through;color:var(--muted);background:var(--bg2);cursor:not-allowed}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.stepper .s{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 10px 4px 4px;border-radius:20px;background:var(--bg2)}
.stepper .s i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fff;font-style:normal;font-size:11px;font-weight:700;border:1px solid var(--line2)}
.stepper .s.on{background:var(--teal-soft);color:var(--teal-ink)}.stepper .s.on i{background:var(--teal);color:#fff;border-color:var(--teal)}
.stepper .s.done i{background:var(--ok);color:#fff;border-color:var(--ok)}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(680px,92%);padding:12px 16px;border-radius:16px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a ul{margin:6px 0;padding-left:18px}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg.sys{align-self:center;background:var(--bg2);font-size:12.5px;color:var(--ink2);border-radius:10px}
.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:20px}
.composer .box{display:flex;gap:6px;align-items:flex-end;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:8px;box-shadow:var(--sh)}
.composer textarea{flex:1;border:0;outline:none;resize:none;min-height:40px;max-height:160px;padding:9px 8px;background:none}
.rec{animation:pulse 1.4s infinite;background:var(--bad)!important;color:#fff!important}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:0 0 18px}
.tl .st:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line2)}
.tl .st.completed:before{background:var(--ok);border-color:var(--ok)}
.tl .st.scheduled:before{background:var(--info);border-color:var(--info)}
.tl .st.pending:before{background:var(--warn);border-color:var(--warn)}
.tl .st.cancelled:before{background:var(--bad);border-color:var(--bad)}
.journey{display:flex;gap:0;overflow-x:auto;padding:8px 0 4px}
.journey .j{flex:1;min-width:86px;text-align:center;position:relative;font-size:11.5px;color:var(--muted)}
.journey .j:before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line2);z-index:0}
.journey .j:first-child:before{display:none}
.journey .j i{position:relative;z-index:1;display:grid;place-items:center;width:24px;height:24px;margin:0 auto 6px;border-radius:50%;background:#fff;border:2px solid var(--line2);font-style:normal;font-size:11px}
.journey .j.completed i{background:var(--ok);border-color:var(--ok);color:#fff}.journey .j.completed:before{background:var(--ok)}
.journey .j.scheduled i{background:var(--info);border-color:var(--info);color:#fff}
.journey .j.pending i{background:var(--warn);border-color:var(--warn);color:#fff}
.journey .j.cancelled i{background:var(--bad);border-color:var(--bad);color:#fff}
.journey .j b{display:block;color:var(--ink);font-weight:500}
.cert{border:1px solid var(--line2);border-radius:18px;padding:28px;background:linear-gradient(180deg,#fff,#fbfaf6);position:relative;overflow:hidden}
.cert:after{content:"";position:absolute;inset:10px;border:1px dashed #d8d2c4;border-radius:12px;pointer-events:none}
.qr{width:116px;height:116px;display:grid;grid-template-columns:repeat(21,1fr);background:#fff;padding:6px;border:1px solid var(--line)}
.qr i{background:var(--ink)} .qr b{background:#fff}
.post{overflow:hidden}
.post .media{aspect-ratio:16/10;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:24px;text-align:center;padding:20px;position:relative}
.post .media.reel{aspect-ratio:9/12}
.post .media .play{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);display:grid;place-items:center}
.post .acts{display:flex;gap:2px;padding:6px 8px;border-top:1px solid var(--line)}
.post .acts button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px}
.post .acts button:hover{background:var(--bg2)}
.post .acts button[aria-pressed="true"]{color:var(--teal)}
.map{position:relative;height:520px;border-radius:14px;overflow:hidden;background:linear-gradient(0deg,rgba(255,255,255,.5),rgba(255,255,255,.5)),repeating-linear-gradient(0deg,#e9e6dd 0 1px,transparent 1px 48px),repeating-linear-gradient(90deg,#e9e6dd 0 1px,transparent 1px 48px),#f3f1ea;border:1px solid var(--line)}
.map .road{position:absolute;background:#fff;border:1px solid #e3dfd4}
.map .pin{position:absolute;transform:translate(-50%,-100%);background:var(--teal);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap;cursor:pointer;border:0;box-shadow:var(--sh)}
.map .pin.sp{background:#8a5a00}
.map .pin:after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:inherit;border-top-color:var(--teal)}

/* ---------- clinic ---------- */
.cal{display:grid;border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--card);max-height:640px}
.cal .hd{position:sticky;top:0;background:#fcfbf9;z-index:2;padding:10px;font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.cal .tm{font-size:11px;color:var(--muted);padding:4px 8px;border-bottom:1px dashed var(--line);height:48px;position:sticky;left:0;background:#fcfbf9;z-index:1}
.cal .cell{border-bottom:1px dashed var(--line);border-left:1px solid var(--line);height:48px;position:relative;cursor:pointer}
.cal .cell:hover{background:var(--blue-soft)}
.appt{position:absolute;left:4px;right:4px;top:3px;border-radius:7px;padding:4px 7px;font-size:11.5px;line-height:1.3;cursor:pointer;border-left:3px solid;overflow:hidden;z-index:1}
.appt.confirmed{background:#e8f0fb;border-color:var(--blue);color:#1d3f7a}
.appt.pending{background:#fdf3df;border-color:var(--warn);color:#6b4500}
.appt.checked_in{background:#e4f4eb;border-color:var(--ok);color:#155c39}
.appt.completed{background:#eef0f3;border-color:#8a93a3;color:#3c4453}
.appt.no_show{background:#fbe9e6;border-color:var(--bad);color:#7f2318}
.appt.block{background:repeating-linear-gradient(135deg,#f1efe9 0 6px,#e8e5dd 6px 12px);border-color:#a7a294;color:#5a5649}
.odonto{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.tooth{aspect-ratio:3/4;border:1.5px solid var(--line2);border-radius:8px 8px 12px 12px;display:grid;place-items:center;font-size:10.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink2);position:relative}
.tooth:hover{border-color:var(--blue)}
.tooth.caries{background:#fde9e5;border-color:var(--bad)}.tooth.filled{background:#e8f0fb;border-color:var(--blue)}.tooth.crown{background:#fdf3df;border-color:var(--warn)}.tooth.rct{background:#efeafb;border-color:var(--violet)}.tooth.missing{background:repeating-linear-gradient(135deg,#f3f1ec 0 4px,#e6e2d9 4px 8px);color:var(--muted)}.tooth.implant{background:#e4f4eb;border-color:var(--ok)}
.tooth.sel{outline:3px solid var(--blue);outline-offset:1px}
.risk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px}
.risk.read{background:#eef0f3;color:#3c4453}.risk.draft{background:var(--info-soft);color:var(--info)}.risk.external{background:var(--warn-soft);color:var(--warn)}.risk.patient{background:#fdeee3;color:#9a4a10}.risk.financial{background:var(--bad-soft);color:var(--bad)}.risk.clinical{background:#2a2f3a;color:#fff}
.life{display:flex;gap:2px;flex-wrap:wrap}
.life span{font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--bg2);color:var(--muted);font-weight:500}
.life span.done{background:var(--ok-soft);color:var(--ok)}
.life span.now{background:var(--accent);color:#fff;animation:pulse 1.4s infinite}
.life span.stop{background:var(--warn-soft);color:var(--warn)}
.life span.fail{background:var(--bad-soft);color:var(--bad)}
.ai-shell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.taskcard{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.taskcard .tc-h{padding:14px 16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);background:#fcfbf9}
.taskcard .tc-b{padding:14px 16px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.preview{background:var(--bg2);border-radius:10px;padding:10px 12px;font-size:12.5px;border:1px dashed var(--line2)}
.draft-mark{border:1.5px dashed var(--violet);background:repeating-linear-gradient(135deg,#faf8ff 0 10px,#f4f0fd 10px 20px);border-radius:10px;padding:12px}

/* ---------- scholar ---------- */
body[data-ws="scholar"] .side{background:#f7f5fb}
.studio{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;min-height:620px}
.thumbs{border-right:1px solid var(--line);overflow:auto;max-height:720px;padding:10px;background:#faf9fc}
.thumb{width:100%;aspect-ratio:16/9;border:1.5px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px;cursor:pointer;padding:6px;font-size:8.5px;text-align:left;overflow:hidden;position:relative}
.thumb.on{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.thumb .n{position:absolute;right:5px;bottom:3px;color:var(--muted)}
.canvas-wrap{padding:24px;background:#eeecf3;display:grid;place-items:center;overflow:auto}
.slide{width:100%;max-width:760px;aspect-ratio:16/9;background:#fff;border-radius:6px;box-shadow:0 8px 30px rgba(40,30,80,.12);padding:5% 6%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.slide h2{font-family:var(--serif);font-weight:400;font-size:clamp(18px,2.6vw,32px);color:#1f1b3a}
.slide .lead{color:#4d4870;margin-top:8px;font-size:clamp(11px,1.3vw,15px)}
.slide ul{margin:12px 0 0;padding-left:20px;font-size:clamp(10px,1.25vw,14.5px);color:#2d2a45;line-height:1.6}
.slide .foot{position:absolute;left:6%;right:6%;bottom:4%;display:flex;justify-content:space-between;font-size:10px;color:#8a85a8}
.slide.title{background:linear-gradient(135deg,#2a1f63,#5b3fb0);color:#fff;justify-content:center}
.slide.title h2{color:#fff;font-size:clamp(22px,3.4vw,42px)}.slide.title .lead{color:#d8d0ff}
.slide.section{background:#f3effc;justify-content:center}
.slide .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;font-size:clamp(10px,1.2vw,13.5px)}
.slide .cols>div{background:#f7f5fd;border-radius:8px;padding:10px}
.slide .flow{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.slide .flow span{flex:1;min-width:70px;background:#efeafb;border-radius:8px;padding:10px 6px;text-align:center;font-size:clamp(9px,1.1vw,12.5px);color:#3a2a80}
.slide table{margin-top:12px;border-collapse:collapse;font-size:clamp(9px,1.1vw,12.5px);width:100%}
.slide td,.slide th{border:1px solid #e3def3;padding:5px 7px;text-align:left}
.props{border-left:1px solid var(--line);padding:16px;overflow:auto;max-height:720px;display:flex;flex-direction:column;gap:14px}
.blue-sec{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.blue-sec input{border:0;outline:none;flex:1;font-weight:500;background:none;min-width:0}
.blue-sec input:focus{box-shadow:0 1px 0 var(--violet)}
.pipeline{display:grid;gap:6px}
.pipeline .p{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;background:var(--bg2);font-size:13px;color:var(--muted)}
.pipeline .p.done{background:var(--ok-soft);color:var(--ok)}.pipeline .p.now{background:var(--violet-soft);color:var(--violet)}
.viva{background:radial-gradient(900px 500px at 50% -20%,#3a2a80 0,#15122b 60%);color:#e9e6ff;border-radius:20px;padding:36px;min-height:520px;display:flex;flex-direction:column}
.viva .q{font-family:var(--serif);font-size:clamp(22px,3vw,34px);line-height:1.15;margin-top:18px;color:#fff}
.viva .timer{font:600 40px var(--mono);color:#fff}
.viva .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.viva .btn.primary{background:#8b6cff;border-color:#8b6cff}
.viva textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:12px;width:100%;min-height:110px}
.poster{aspect-ratio:3/4;background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;grid-template-rows:auto 1fr auto;gap:12px;box-shadow:var(--sh-lg)}
.poster .pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11px}
.poster .pg>div{background:#f6f3fd;border-radius:8px;padding:10px}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px var(--sans);fill:var(--muted)}
.chart .grid line{stroke:#ece9e2}
.chart .hit:hover+.mk,.chart .bar:hover{opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;box-shadow:var(--sh-lg);white-space:nowrap}

/* ---------- tour ---------- */
.tour{position:fixed;left:20px;bottom:20px;z-index:85;width:340px;background:var(--ink);color:#e6e8ee;border-radius:16px;padding:16px;box-shadow:var(--sh-lg)}
.tour h4{color:#fff}
.tour .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.tour .btn.primary{background:#2bb3b0;border-color:#2bb3b0;color:#082c2c}
.tour .bar{height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin:10px 0}
.tour .bar i{display:block;height:100%;background:#2bb3b0}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ai-shell{grid-template-columns:1fr}
  .studio{grid-template-columns:150px minmax(0,1fr)}
  .studio .props{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}
}
@media (max-width:900px){
  .login{grid-template-columns:1fr}.login-hero{padding:32px 20px}.login-side{padding:28px 16px}
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:60px;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh-lg)}
  body.side-open .side{transform:none}
  .menu-btn{display:grid!important}
  .content{padding:18px 16px 96px}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span3{grid-column:auto}
}
@media (max-width:700px){
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
  .role-grid{grid-template-columns:1fr}
  .top{padding:0 12px;gap:6px}.brand-text,.ws-label,.search-btn span,.search-btn kbd{display:none}
  .search-btn{flex:0 0 36px;padding:0;justify-content:center}
  body[data-ws="main"] .mainnav{display:none}
  body[data-ws="main"] .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 0}
  .bottomnav a[aria-current="page"]{color:var(--teal)}
  .main-content{padding:16px 16px 96px}
  .kv{grid-template-columns:1fr}
  .studio{grid-template-columns:1fr}.thumbs{display:flex;gap:8px;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.thumb{width:120px;flex:none}
  .tour{left:12px;right:12px;width:auto;bottom:76px}
  .odonto{grid-template-columns:repeat(8,1fr)}
  .toasts{left:12px;right:12px;bottom:76px}
  .hide-m{display:none!important}
}
body[data-ws="main"] .menu-btn{display:none!important}
@media (max-width:900px){.grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}}
@media print{.top,.mainnav,.side,.bottomnav,.demo-strip,.tour,.toasts,.no-print{display:none!important}.layout{display:block}.drawer,.modal{position:static;transform:none;box-shadow:none;width:auto}.scrim{display:none}}
</style>

  KEY: 'fmd_db_v1', SKEY: 'fmd_session_v1',
  load() { try { return JSON.parse(localStorage.getItem(this.KEY)); } catch { return null; } },
  save(db) { try { localStorage.setItem(this.KEY, JSON.stringify(db)); } catch (e) { console.warn('Storage full/blocked — running in memory', e); } },
  session() { try { return JSON.parse(localStorage.getItem(this.SKEY)); } catch { return null; } },
  setSession(s) { try { s ? localStorage.setItem(this.SKEY, JSON.stringify(s)) : localStorage.removeItem(this.SKEY); } catch {} },
  reset() { try { localStorage.removeItem(this.KEY); localStorage.removeItem(this.SKEY); } catch {} },
};
</script>

<!-- ============================================================
     STATE — single source of truth, persisted through Storage
     ============================================================ -->
<script>
const State = {
  db: null, user: null, listeners: [],
  init() {
    this.db = Storage.load() || JSON.parse(JSON.stringify(MockData.seed()));
    const s = Storage.session();
    this.user = s ? this.db.users.find(u => u.id === s.id) || null : null;
  },
  commit() { Storage.save(this.db); App.render(); },
  id(prefix) { return prefix + String(Date.now()).slice(-5) + (this.db.seq++); },
  get(coll, id) { return this.db[coll].find(x => x.id === id); },
  login(id) { this.user = this.db.users.find(u => u.id === id); Storage.setSession({ id }); Audit.log('Login', 'session:' + id, 'low'); },
  logout() { this.user = null; Storage.setSession(null); },
};
const $db = () => State.db;
const me = () => State.user;
</script>

<!-- ============================================================
     PERMISSIONS — every protected action routes through here
     ============================================================ -->
<script>
const Permissions = {
  WS: { patient: ['main'], dentist: ['main', 'clinic', 'scholar'], student: ['main', 'scholar'], company: ['main'], clinic_owner: ['main', 'clinic'], clinic_staff: ['main', 'clinic'], support: ['main', 'admin'], moderator: ['main', 'admin'], super_admin: ['main', 'admin'], accountant: ['admin'] },
  workspaces(u) { return u ? this.WS[u.role] || ['main'] : []; },
  canEnter(u, ws) { return this.workspaces(u).includes(ws); },
  isClinicRole(u) { return ['clinic_owner', 'clinic_staff', 'dentist'].includes(u?.role); },
  canViewClinic(u, clinicId) { return this.isClinicRole(u) && u.clinicId === clinicId; },
  canViewPatientRecord(u, rec) {
    if (!u || !rec) return false;
    if (u.role === 'patient') return rec.patientId === u.patientId;
    if (u.role === 'dentist') return rec.clinicId === u.clinicId || $db().shares.some(s => s.recordId === rec.id && s.dentistId === u.dentistId && s.status === 'active');
    if (u.role === 'clinic_owner') return rec.clinicId === u.clinicId;
    if (u.role === 'clinic_staff') return rec.clinicId === u.clinicId && !['X-rays', 'Photos', 'Clinical documents'].includes(rec.cat);
    return false; // admin, support, moderator, accountant: no clinical records
  },
  canViewPatient(u, p) { return (u?.role === 'patient' && u.patientId === p.id) || (this.isClinicRole(u) && p.clinicIds.includes(u.clinicId)); },
  canViewClinicalNotes(u) { return ['dentist', 'clinic_owner'].includes(u?.role); },
  canEditClinicalNote(u, note) {
    if (!['dentist', 'clinic_owner'].includes(u?.role)) return { ok: false, reason: 'Only clinicians can write clinical notes.' };
    if (note?.signed) return { ok: false, reason: 'Signed notes cannot be modified. Use the amendment workflow — the original stays on record.' };
    return { ok: true };
  },
  canIssueWarranty(u, clinicId) { return ['clinic_owner', 'dentist'].includes(u?.role) && u.clinicId === clinicId; },
  canBill(u, clinicId) { return this.isClinicRole(u) && u.clinicId === clinicId; },
  canRefund(u) { return u?.role === 'clinic_owner'; },
  canApproveAITask(u, task) {
    if (!this.isClinicRole(u) || u.clinicId !== task.clinicId) return { ok: false, reason: 'Outside your clinic.' };
    if (task.risk === 'clinical') return { ok: false, reason: 'Clinical decisions cannot be delegated to AI.' };
    if (task.risk === 'financial' && u.role !== 'clinic_owner') return { ok: false, reason: 'Financial actions need the clinic owner’s authorisation.' };
    return { ok: true };
  },
  canExportAccountingData(u) { return ['accountant', 'super_admin'].includes(u?.role); },
  canViewFinance(u) { return ['accountant', 'super_admin'].includes(u?.role); },
  canModerate(u) { return ['moderator', 'super_admin'].includes(u?.role); },
  canVerify(u) { return ['super_admin', 'support'].includes(u?.role); },
  canManageConcierge(u) { return ['support', 'super_admin'].includes(u?.role); },
  canConfigure(u) { return u?.role === 'super_admin'; },
  canBook(u) { return u?.role === 'patient'; },
  canPublish(u) { return ['dentist', 'clinic_owner', 'company'].includes(u?.role); },
  /** Wraps a check: returns true, or toasts + audits a denial. */
  guard(result, what) {
    const ok = typeof result === 'object' ? result.ok : result;
    if (!ok) { UI.toast((result.reason || 'You don’t have permission to ' + what + '.'), 'bad'); Audit.log('Permission denied: ' + what, '—', 'medium', 'Denied'); }
    return ok;
  },
};
</script>

<script>
const Audit = {
  log(action, target, risk = 'low', result = 'Success', reason = '—') {
    const u = me();
    $db().audit.unshift({ id: 'AUD-' + (78000 + $db().audit.length), actor: u ? u.name : 'System', role: u ? u.label : 'System', action, target, risk, clinic: u?.clinicId ? State.get('clinics', u.clinicId).name : '—', at: new Date().toISOString(), ip: '10.0.x.x', reason, result });
    return $db().audit[0].id;
  },
};
const Notify = {
  // Previews never carry clinical detail — only the event type and a neutral line.
  send(to, type, text, link = '#/') { $db().notifications.unshift({ id: State.id('NT'), to, type, text, at: new Date().toISOString(), read: false, link }); },
  forUser(u) { return $db().notifications.filter(n => n.to === u.id || n.to === u.patientId || (n.to === 'clinic:' + u.clinicId && Permissions.isClinicRole(u)) || (n.to === 'admin' && ['super_admin', 'support'].includes(u.role))); },
  unread(u) { return this.forUser(u).filter(n => !n.read).length; },
};

const today = () => MockData.day(0);
const nowISO = () => new Date().toISOString();
class ServiceError extends Error { constructor(code, msg, extra) { super(msg); this.code = code; Object.assign(this, extra); } }

const Booking = {
  TIMES: ['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00'],
  slots(dentistId, clinicId, date) {
    const taken = $db().appointments.filter(a => a.dentistId === dentistId && a.date === date && !['cancelled'].includes(a.status)).map(a => a.time);
    const seed = (dentistId + date).split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    return this.TIMES.map((t, i) => ({ time: t, taken: taken.includes(t) || (seed + i * 7) % 5 === 0, hot: t === '12:00' }))
      .filter(s => !(date === today() && s.time < new Date().toTimeString().slice(0, 5)));
  },
  /** Patient must explicitly confirm; AI can never call this with confirmed=false. */
  bookAppointment({ patientId, dentistId, clinicId, serviceId, date, time, reason, confirmed }) {
    if (!confirmed) throw new ServiceError('NEEDS_CONFIRMATION', 'Booking needs your explicit confirmation.');
    if (!Permissions.canBook(me())) throw new ServiceError('DENIED', 'Only patients can book from FMD Main in this demo.');
    if (!date || !time) throw new ServiceError('VALIDATION', 'Pick a date and time.');
    const dup = $db().appointments.find(a => a.patientId === patientId && a.dentistId === dentistId && a.date === date && !['cancelled', 'completed', 'no_show'].includes(a.status));
    if (dup) throw new ServiceError('DUPLICATE', `You already have a booking with this dentist on this day (${dup.time}).`, { existing: dup });
    const s = this.slots(dentistId, clinicId, date).find(x => x.time === time);
    if (!s || s.taken || (s.hot && !this._hotFailed?.[dentistId + date])) {
      (this._hotFailed ||= {})[dentistId + date] = true;
      const alts = this.slots(dentistId, clinicId, date).filter(x => !x.taken && x.time !== time).slice(0, 4).map(x => x.time);
      $db().appointments.push({ id: State.id('A'), patientId: 'p30', dentistId, clinicId, serviceId, date, time, chair: 'Chair 1', status: 'confirmed', fee: 0, reason: 'Held by another patient', source: 'FMD Main', episodeId: null, created: nowISO() });
      throw new ServiceError('SLOT_TAKEN', 'This slot was just taken by another patient.', { alts });
    }
    const svc = MockData.SERVICES.find(x => x.id === serviceId), clinic = State.get('clinics', clinicId), dent = State.get('dentists', dentistId);
    const ep = Journey.start(patientId, clinicId, dentistId, reason || svc.name);
    const appt = { id: State.id('A'), patientId, dentistId, clinicId, serviceId, date, time, chair: 'Chair 1', status: clinic.onOS ? 'confirmed' : 'pending', fee: svc.fee, reason: reason || svc.name, source: 'FMD Main', episodeId: ep.id, created: nowISO() };
    $db().appointments.push(appt);
    Journey.setStage(ep.id, 'Appointment', 'scheduled', date);
    Notify.send(patientId, 'Appointment confirmation', `Booking ${appt.status === 'confirmed' ? 'confirmed' : 'requested'} at ${clinic.name} on ${UI.date(date)}, ${time}.`, '#/main/appointments');
    Notify.send('clinic:' + clinicId, 'New booking', `New FMD booking for ${UI.date(date)} ${time} with ${dent.name}.`, '#/clinic/appointments');
    Audit.log('Appointment booked', 'appointment:' + appt.id, 'low');
    return appt;
  },
  reschedule(id, date, time, by = 'patient') {
    const a = State.get('appointments', id);
    if (!a || ['cancelled', 'completed'].includes(a.status)) throw new ServiceError('STATE', 'This appointment can no longer be changed.');
    const s = this.slots(a.dentistId, a.clinicId, date).find(x => x.time === time);
    if (!s || s.taken) throw new ServiceError('SLOT_TAKEN', 'That slot isn’t available.');
    const old = `${UI.date(a.date)} ${a.time}`; a.date = date; a.time = time; a.status = by === 'clinic' ? 'confirmed' : a.status;
    if (a.episodeId) Journey.setStage(a.episodeId, 'Appointment', 'scheduled', date);
    Notify.send(a.patientId, 'Booking change', `${by === 'clinic' ? 'The clinic moved' : 'You moved'} your appointment from ${old} to ${UI.date(date)} ${time}.`, '#/main/appointments');
    Notify.send('clinic:' + a.clinicId, 'Booking change', `Appointment ${a.id} rescheduled to ${UI.date(date)} ${time}.`, '#/clinic/appointments');
    Audit.log('Appointment rescheduled by ' + by, 'appointment:' + a.id, 'low');
    return a;
  },
  cancel(id, by = 'patient', reason = '') {
    const a = State.get('appointments', id);
    if (!a || a.status === 'cancelled') throw new ServiceError('STATE', 'Already cancelled.');
    const hrs = (new Date(a.date + 'T' + a.time) - new Date()) / 36e5;
    a.status = 'cancelled'; a.cancelReason = reason; a.lateCancel = hrs < 24 && by === 'patient';
    if (a.episodeId) Journey.setStage(a.episodeId, 'Appointment', 'cancelled');
    Notify.send(a.patientId, 'Booking change', `Appointment on ${UI.date(a.date)} was cancelled${by === 'clinic' ? ' by the clinic' : ''}.`, '#/main/appointments');
    Notify.send('clinic:' + a.clinicId, 'Booking change', `Appointment ${a.id} cancelled by ${by}.`, '#/clinic/appointments');
    Audit.log('Appointment cancelled by ' + by, 'appointment:' + a.id, 'low', 'Success', reason || '—');
    return a;
  },
  setStatus(id, status) {
    const a = State.get('appointments', id); a.status = status;
    if (status === 'completed' && a.episodeId) Journey.setStage(a.episodeId, 'Consultation', 'completed');
    Audit.log('Appointment marked ' + status, 'appointment:' + id, 'low');
  },
  clinicBook({ patientId, dentistId, date, time, chair, serviceId, clinicId }) {
    const conflict = $db().appointments.find(a => a.clinicId === clinicId && a.date === date && a.time === time && (a.dentistId === dentistId || a.chair === chair) && a.status !== 'cancelled');
    if (conflict) throw new ServiceError('CONFLICT', `Conflict: ${conflict.status === 'block' ? 'blocked time' : 'another appointment'} at ${time} for this ${conflict.dentistId === dentistId ? 'provider' : 'chair'}.`);
    const svc = MockData.SERVICES.find(s => s.id === serviceId);
    const a = { id: State.id('A'), patientId, dentistId, clinicId, serviceId, date, time, chair, status: 'confirmed', fee: svc.fee, reason: svc.name, source: 'Clinic', episodeId: null, created: nowISO() };
    $db().appointments.push(a);
    Notify.send(patientId, 'Appointment confirmation', `Appointment booked at ${State.get('clinics', clinicId).name} on ${UI.date(date)} ${time}.`, '#/main/appointments');
    Audit.log('Clinic booked appointment', 'appointment:' + a.id, 'low');
    return a;
  },
  block({ clinicId, dentistId, date, time, chair }) {
    $db().appointments.push({ id: State.id('B'), patientId: null, dentistId, clinicId, serviceId: null, date, time, chair, status: 'block', fee: 0, reason: 'Blocked time', source: 'Clinic' });
  },
};

const Journey = {
  start(patientId, clinicId, dentistId, title) {
    const ep = { id: State.id('E'), patientId, clinicId, dentistId, title, tooth: '', started: today(), status: 'active',
      stages: MockData.STAGES.map((n, i) => ({ name: n, status: i < 2 ? 'completed' : 'planned', date: i < 2 ? today() : null })) };
    $db().episodes.unshift(ep); return ep;
  },
  setStage(epId, name, status, date) {
    const ep = State.get('episodes', epId); if (!ep) return;
    const st = ep.stages.find(s => s.name === name); st.status = status; st.date = date || today();
    if (name === 'Closure' && status === 'completed') ep.status = 'closed';
  },
  /** Clinic updates a stage; patient sees it immediately. */
  updateTreatment(epId, name, status) {
    const ep = State.get('episodes', epId);
    if (!Permissions.guard(Permissions.canViewClinic(me(), ep.clinicId), 'update treatment')) return;
    this.setStage(epId, name, status);
    if (name === 'Treatment' && status === 'completed') {
      this.setStage(epId, 'Invoice', 'pending'); this.setStage(epId, 'Follow-up', 'scheduled', MockData.day(14));
      $db().records.unshift({ id: State.id('R'), patientId: ep.patientId, cat: 'Clinical documents', title: 'Treatment summary — ' + ep.title, date: today(), dentistId: ep.dentistId, clinicId: ep.clinicId, episodeId: ep.id, size: '96 KB', uploadedBy: 'clinic' });
    }
    Notify.send(ep.patientId, 'Care journey update', 'Your treatment journey has a new update from your clinic.', '#/main/journey');
    Audit.log(`Treatment stage "${name}" → ${status}`, 'episode:' + epId, 'medium');
  },
};

const Records = {
  upload(patientId, { title, cat, fileName }) {
    const r = { id: State.id('R'), patientId, cat, title: title || fileName, date: today(), dentistId: null, clinicId: null, episodeId: null, size: Math.ceil(Math.random() * 900 + 60) + ' KB', uploadedBy: 'patient' };
    $db().records.unshift(r); this.log(r.id, 'You', 'Uploaded'); Audit.log('Record uploaded', 'record:' + r.id, 'low'); return r;
  },
  share(recordId, dentistId, duration) {
    const rec = State.get('records', recordId);
    if (!Permissions.guard(Permissions.canViewPatientRecord(me(), rec) && me().role === 'patient', 'share this record')) return;
    const hours = { '1 hour': 1, '24 hours': 24, '7 days': 168, 'Until revoked': null }[duration];
    const d = State.get('dentists', dentistId);
    const sh = { id: State.id('SH'), recordId, with: d.name, dentistId, duration, created: nowISO(), expires: hours ? new Date(Date.now() + hours * 36e5).toISOString() : null, status: 'active' };
    $db().shares.unshift(sh); this.log(recordId, 'You', `Shared with ${d.name} (${duration})`); Audit.log('Shared record', 'record:' + recordId, 'medium');
    return sh;
  },
  revoke(shareId) { const s = State.get('shares', shareId); s.status = 'revoked'; this.log(s.recordId, 'You', 'Revoked access for ' + s.with); Audit.log('Revoked record share', 'share:' + shareId, 'medium'); },
  log(recordId, who, what) { $db().accessLog.unshift({ recordId, who, what, when: nowISO() }); },
  requestDelete(recordId) { const r = State.get('records', recordId); r.deleteRequested = true; this.log(recordId, 'You', 'Deletion requested'); Audit.log('Record deletion requested', 'record:' + recordId, 'medium'); },
};

const Clinical = {
  addNote(patientId, text, { ai = false, episodeId = null } = {}) {
    if (!Permissions.guard(Permissions.canEditClinicalNote(me(), null), 'write notes')) return;
    const n = { id: State.id('N'), patientId, author: me().dentistId || me().id, authorName: me().name, at: nowISO(), text, signed: false, amendments: [], ai, aiAccepted: false, episodeId };
    $db().notes.unshift(n); Audit.log(ai ? 'AI note draft created' : 'Clinical note drafted', 'note:' + n.id, 'medium'); return n;
  },
  sign(noteId) {
    const n = State.get('notes', noteId);
    if (n.ai && !n.aiAccepted) throw new ServiceError('AI_DRAFT', 'Review and accept the AI draft before signing.');
    n.signed = true; n.signedAt = nowISO(); Audit.log('Clinical note signed', 'note:' + noteId, 'medium');
  },
  acceptDraft(noteId) { const n = State.get('notes', noteId); n.aiAccepted = true; n.acceptedBy = me().name; Audit.log('AI draft accepted by clinician', 'note:' + noteId, 'medium'); },
  edit(noteId, text) { const n = State.get('notes', noteId); const c = Permissions.canEditClinicalNote(me(), n); if (!Permissions.guard(c, 'edit this note')) return false; n.text = text; return true; },
  amend(noteId, text) { const n = State.get('notes', noteId); n.amendments.push({ at: nowISO(), by: me().name, text }); Audit.log('Clinical note amended', 'note:' + noteId, 'high'); },
  chart(patientId, tooth, cond) {
    const p = State.get('patients', patientId);
    (p.chartHistory ||= []).push({ at: nowISO(), tooth, from: p.chart[tooth] || 'sound', to: cond, by: me().name });
    if (cond === 'sound') delete p.chart[tooth]; else p.chart[tooth] = cond;
    Audit.log(`Charted tooth ${tooth}: ${cond}`, 'patient:' + patientId, 'medium');
  },
};

const Plans = {
  save(planId, items, note) {
    const p = State.get('plans', planId);
    p.items = items; p.version++; p.status = 'awaiting acknowledgement'; p.history.push({ v: p.version, at: nowISO(), by: me().name, note: note || 'Updated plan' });
    const ep = $db().episodes.find(e => e.id === p.episodeId); if (ep) { Journey.setStage(ep.id, 'Estimate', 'completed'); Journey.setStage(ep.id, 'Treatment plan', 'pending'); }
    Notify.send(p.patientId, 'Treatment plan', 'An updated treatment estimate is ready for you to review.', '#/main/journey');
    Audit.log('Treatment plan v' + p.version + ' saved', 'plan:' + planId, 'medium');
  },
  acknowledge(planId) { const p = State.get('plans', planId); p.status = 'acknowledged'; const ep = State.get('episodes', p.episodeId); if (ep) Journey.setStage(ep.id, 'Treatment plan', 'completed'); Audit.log('Plan acknowledged by patient', 'plan:' + planId, 'low'); },
  total(p) { return p.items.reduce((a, i) => a + i.fee - (i.discount || 0), 0); },
};

const Billing = {
  createInvoice({ patientId, clinicId, items, discount = 0, episodeId = null }) {
    if (!Permissions.guard(Permissions.canBill(me(), clinicId), 'create invoices')) return;
    if (!items.length || items.some(i => !(i.amount > 0))) throw new ServiceError('VALIDATION', 'Each line needs a positive amount.');
    const total = items.reduce((a, i) => a + i.amount * (i.qty || 1), 0) - discount;
    const inv = { id: 'INV-' + (1001 + $db().invoices.length), patientId, clinicId, date: today(), items, discount, total, paid: 0, status: 'unpaid', payments: [], episodeId };
    $db().invoices.unshift(inv);
    $db().records.unshift({ id: State.id('R'), patientId, cat: 'Invoices', title: inv.id, date: today(), dentistId: null, clinicId, episodeId, size: '42 KB', uploadedBy: 'clinic' });
    if (episodeId) Journey.setStage(episodeId, 'Invoice', 'completed');
    Notify.send(patientId, 'Invoice', `A new invoice (${inv.id}) is available in your records.`, '#/main/records');
    Audit.log('Invoice created', 'invoice:' + inv.id, 'medium');
    return inv;
  },
  pay(invId, amount, mode) {
    const inv = State.get('invoices', invId);
    if (!(amount > 0) || amount > inv.total - inv.paid) throw new ServiceError('VALIDATION', `Amount must be between ₹1 and ${fmtINR(inv.total - inv.paid)}.`);
    inv.payments.push({ at: today(), amount, mode }); inv.paid += amount; inv.status = inv.paid >= inv.total ? 'paid' : 'partial';
    Audit.log('Payment recorded (' + mode + ')', 'invoice:' + invId, 'medium');
  },
  refund(invId, amount, reason) {
    if (!Permissions.guard(Permissions.canRefund(me()), 'authorise refunds')) return false;
    const inv = State.get('invoices', invId); inv.payments.push({ at: today(), amount: -amount, mode: 'Refund' }); inv.paid -= amount; inv.status = 'refunded';
    Audit.log('Refund authorised', 'invoice:' + invId, 'high', 'Success', reason); return true;
  },
  void(invId, reason) { if (!Permissions.guard(Permissions.canRefund(me()), 'void invoices')) return; const inv = State.get('invoices', invId); inv.status = 'void'; Audit.log('Invoice voided', 'invoice:' + invId, 'high', 'Success', reason); },
};

const Warranty = {
  issueWarranty(data) {
    if (!Permissions.guard(Permissions.canIssueWarranty(me(), data.clinicId), 'issue warranties')) return;
    const w = { id: 'WC-' + new Date().getFullYear() + '-' + String(500 + $db().warranties.length).padStart(5, '0'), status: 'Active', issueDate: today(), amendments: [], docs: ['Treatment summary'], ...data };
    $db().warranties.unshift(w);
    if (data.episodeId) Journey.setStage(data.episodeId, 'Warranty', 'completed');
    $db().records.unshift({ id: State.id('R'), patientId: data.patientId, cat: 'Clinical documents', title: 'Warranty certificate ' + w.id, date: today(), dentistId: data.dentistId, clinicId: data.clinicId, episodeId: data.episodeId, size: '64 KB', uploadedBy: 'clinic' });
    Notify.send(data.patientId, 'Warranty issued', 'A treatment warranty certificate was issued by your clinic.', '#/main/warranty');
    Audit.log('Warranty issued', 'warranty:' + w.id, 'medium');
    return w;
  },
  verify(id) { const w = $db().warranties.find(x => x.id.toLowerCase() === String(id).trim().toLowerCase()); if (w && w.status === 'Active' && w.validUntil < today()) w.status = 'Expired'; return w; },
  amend(id, note) { const w = State.get('warranties', id); w.amendments.push({ at: today(), note }); w.status = 'Amended'; Audit.log('Warranty amended', 'warranty:' + id, 'medium'); },
  setStatus(id, status, note) { const w = State.get('warranties', id); w.status = status; w.amendments.push({ at: today(), note: status + (note ? ': ' + note : '') }); Audit.log('Warranty ' + status, 'warranty:' + id, 'medium'); },
};

const Concierge = {
  STATUSES: ['New','Contact Attempted','Contacted','Needs Clarification','Coordinating','Awaiting Patient','Confirmed','Closed','Cancelled'],
  createConciergeEnquiry({ patientId, need, location, timing, contactPref, notes }) {
    if (!need || need.trim().length < 8) throw new ServiceError('VALIDATION', 'Tell us a little more about what you need (at least a few words).');
    if (!location) throw new ServiceError('VALIDATION', 'Add your area so we can find nearby clinics.');
    const q = { id: 'CQ-' + (3100 + $db().concierge.length), patientId, need, location, timing, contactPref, notes: notes || '', status: 'New', priority: /pain|swell|broken|bleed|fever/i.test(need) ? 'High' : 'Medium', coordinator: null, created: nowISO(), history: [{ at: nowISO(), by: 'System', what: 'Enquiry received' }], checklist: { consent: false, needs: false, clinic: false, confirmed: false }, consent: true, escalated: false, outcome: '' };
    $db().concierge.unshift(q);
    Notify.send(patientId, 'Concierge update', `We received your request (${q.id}). A coordinator will contact you.`, '#/main/concierge');
    Notify.send('admin', 'Concierge', `New Concierge enquiry ${q.id} (${q.priority} priority).`, '#/admin/concierge');
    Audit.log('Concierge enquiry created', 'concierge:' + q.id, 'low');
    return q;
  },
  update(id, patch, note) {
    if (!Permissions.guard(Permissions.canManageConcierge(me()), 'manage Concierge')) return;
    const q = State.get('concierge', id); const prev = q.status; Object.assign(q, patch);
    q.history.unshift({ at: nowISO(), by: me().name, what: note || (patch.status && patch.status !== prev ? `Status → ${patch.status}` : 'Updated') });
    if (patch.status && patch.status !== prev) Notify.send(q.patientId, 'Concierge update', `Your Concierge request ${q.id} is now: ${patch.status}.`, '#/main/concierge');
    Audit.log('Concierge ' + (patch.status || 'updated'), 'concierge:' + id, 'low');
  },
};

const Reviews = {
  submit({ clinicId, dentistId, scores, text, visibility }) {
    const r = { id: State.id('RV'), patientId: me().patientId, clinicId, dentistId, scores, text, visibility, verified: $db().appointments.some(a => a.patientId === me().patientId && a.clinicId === clinicId && a.status === 'completed'), response: '', status: 'Published', at: today() };
    if (scores.overall <= 2) {
      r.status = 'Escalated';
      Notify.send('clinic:' + clinicId, 'Feedback escalation', 'A patient left low-rated feedback that needs a response within 48h.', '#/clinic/reviews');
      $db().moderation.unshift({ id: 'MD-' + (800 + $db().moderation.length), type: 'Review', title: text.slice(0, 60), reason: 'Negative feedback — escalation watch', status: 'Pending', reports: 0, at: nowISO() });
    }
    if (visibility === 'private') r.status = scores.overall <= 2 ? 'Escalated' : 'Private';
    $db().reviews.unshift(r); Audit.log('Feedback submitted (' + visibility + ')', 'review:' + r.id, 'low'); return r;
  },
  respond(id, text) { const r = State.get('reviews', id); r.response = text; if (r.status === 'Escalated') r.status = 'Responded'; Audit.log('Clinic responded to review', 'review:' + id, 'low'); },
  report(id, reason) { const r = State.get('reviews', id); r.status = 'Reported'; $db().moderation.unshift({ id: 'MD-' + (800 + $db().moderation.length), type: 'Review', title: r.text.slice(0, 60), reason, status: 'Pending', reports: 1, at: nowISO() }); Audit.log('Review reported', 'review:' + id, 'low'); },
};

const Content = {
  toggle(postId, key) { const p = State.get('posts', postId); p[key] = !p[key]; const n = key === 'liked' ? 'likes' : 'saves'; p[n] += p[key] ? 1 : -1; },
  vote(postId, i) { const p = State.get('posts', postId); if (p.voted != null) return; p.poll.votes[i]++; p.voted = i; },
  report(postId, reason) { const p = State.get('posts', postId); p.status = 'Reported'; $db().moderation.unshift({ id: 'MD-' + (800 + $db().moderation.length), type: p.type === 'reel' ? 'Reel' : 'Post', title: p.title, reason, status: 'Pending', reports: 1, at: nowISO() }); Audit.log('Content reported', 'post:' + postId, 'low'); },
  /** Journey 7: case content → consent check → AI draft → clinical review → approval → publish */
  createCase({ title, consentRef, body, aiDraft }) {
    if (!Permissions.guard(Permissions.canPublish(me()), 'publish content')) return;
    if (!me().dentistId && !me().clinicId) throw new ServiceError('DENIED', 'Case content can only be created by clinicians or clinics.');
    const p = { id: State.id('P'), authorType: me().dentistId ? 'dentist' : 'clinic', authorId: me().dentistId || me().clinicId, type: 'case', title, body, likes: 0, comments: 0, saves: 0, sponsored: false, status: 'Draft', consent: consentRef ? 'verified' : 'missing', hue: '#6243b5', at: nowISO(), aiDraft: !!aiDraft, reviewed: false };
    $db().posts.unshift(p); Audit.log('Case content drafted', 'post:' + p.id, 'low'); return p;
  },
  advance(postId) {
    const p = State.get('posts', postId);
    if (p.type === 'case' && p.consent !== 'verified') throw new ServiceError('CONSENT', 'Case content cannot be published without verified patient consent.');
    if (p.aiDraft && !p.reviewed) throw new ServiceError('REVIEW', 'An AI-drafted post needs clinical review first.');
    p.status = { Draft: 'Review', Review: 'Published', Published: 'Archived' }[p.status] || p.status;
    if (p.status === 'Published') { p.at = nowISO(); Audit.log('Content published to FMD Main', 'post:' + postId, 'low'); }
  },
};

const Inventory = {
  status(it) { return it.stock === 0 ? 'Out of stock' : it.stock < it.threshold ? 'Low stock' : it.expiry && it.expiry < MockData.day(30) ? 'Expiring' : 'OK'; },
  move(id, qty, note) { const it = State.get('inventory', id); if (it.stock + qty < 0) throw new ServiceError('VALIDATION', 'Stock cannot go below zero.'); it.stock += qty; it.moves.unshift({ at: today(), qty, note }); Audit.log('Stock movement ' + (qty > 0 ? '+' : '') + qty, 'item:' + id, 'low'); },
  draftPO(items, by = 'AI') { const po = { id: 'PO-' + (300 + $db().pos.length), items: items.map(i => ({ id: i.id, name: i.name, qty: Math.max(i.threshold * 2 - i.stock, 1), supplier: i.supplier })), status: 'Draft — needs approval', by, at: nowISO() }; $db().pos.unshift(po); return po; },
  approvePO(id) { if (!Permissions.guard(Permissions.canRefund(me()), 'approve purchase orders')) return; const po = State.get('pos', id); po.status = 'Approved — sent to supplier (simulated)'; Audit.log('Purchase order approved', 'po:' + id, 'high'); },
};

const Support = {
  createSupportTicket(data) {
    if (!data.subject || data.subject.length < 6) throw new ServiceError('VALIDATION', 'Add a short subject (6+ characters).');
    const t = { id: 'TK-' + (2201 + $db().tickets.length + 10), clinicId: me().clinicId, status: 'Open', owner: null, escalated: false, at: nowISO(), history: [{ at: nowISO(), what: 'Opened by ' + me().name }], version: 'Clinic OS 2.4.1', ...data };

const Accounting = {
  addExpense(e) {
    if (!Permissions.guard(Permissions.canViewFinance(me()), 'enter expenses')) return;
    if (!e.vendor || !(e.amount > 0)) throw new ServiceError('VALIDATION', 'Vendor and a positive amount are required.');
    const x = { id: 'EX-' + (3300 + $db().expenses.length), reconciled: false, receipt: !!e.receipt, gst: e.gst || 0, tds: e.tds || 0, ...e };
    $db().expenses.unshift(x); Audit.log('Expense entered', 'expense:' + x.id, 'low'); return x;
  },
  candidates(bk) {
    const pool = bk.dir === 'cr' ? $db().income.map(x => ({ ...x, kind: 'income', net: x.amount + x.gst })) : $db().expenses.map(x => ({ ...x, kind: 'expense', net: x.amount + x.gst - x.tds }));
    return pool.filter(x => !x.reconciled).sort((a, b) => Math.abs(a.net - bk.amount) - Math.abs(b.net - bk.amount)).slice(0, 4);
  },
  reconcileTransaction(bankId, ledgerId) {
    if (!Permissions.guard(Permissions.canViewFinance(me()), 'reconcile')) return;
    const bk = State.get('bank', bankId); const l = State.get('income', ledgerId) || State.get('expenses', ledgerId);
    const net = l.amount + l.gst - (l.tds || 0);
    if (Math.abs(net - bk.amount) > 1) throw new ServiceError('MISMATCH', `Amounts differ by ${fmtINR(Math.abs(net - bk.amount))}. Mark as exception or choose another entry.`);
    bk.status = 'matched'; bk.matched = ledgerId; l.reconciled = true; Audit.log('Bank transaction reconciled', 'bank:' + bankId, 'medium');
  },
  markException(bankId) { State.get('bank', bankId).status = 'exception'; },
  resolveException(bankId, resolution) { const bk = State.get('bank', bankId); bk.status = 'resolved'; bk.resolution = resolution; Audit.log('Bank exception resolved', 'bank:' + bankId, 'medium', 'Success', resolution); },
  importStatement() {
    const n = $db().bank.length;
    const add = [{ desc: 'NEFT CR RZP SETTLEMENT DEMO', amount: 9440, dir: 'cr' }, { desc: 'IMPS DR CLOUD HOSTING DEMO', amount: 17700, dir: 'dr' }, { desc: 'UPI CR UNKNOWN 99812', amount: 2360, dir: 'cr' }];
    add.forEach((a, i) => $db().bank.push({ id: 'BK-' + (930 + n + i), date: today(), matched: null, status: 'unmatched', ...a }));
    $db().income.unshift({ id: 'IN-' + (5100 + $db().income.length), date: today(), cat: 'Membership', party: 'Razorpay settlement (demo)', amount: 8000, gst: 1440, ref: 'RZP-DEMO-99001', reconciled: false });
    $db().expenses.unshift({ id: 'EX-' + (3300 + $db().expenses.length), date: today(), cat: 'Cloud', vendor: 'Cloud hosting (demo)', amount: 15000, gst: 2700, tds: 0, reconciled: false, receipt: true });
    Audit.log('Bank statement imported (3 rows)', 'bank', 'low'); return add.length;
  },
  totals() {
    const inc = $db().income.reduce((a, x) => a + x.amount, 0), exp = $db().expenses.reduce((a, x) => a + x.amount, 0);
    const gstOut = $db().income.reduce((a, x) => a + x.gst, 0), gstIn = $db().expenses.reduce((a, x) => a + x.gst, 0), tds = $db().expenses.reduce((a, x) => a + x.tds, 0);
    return { inc, exp, profit: inc - exp, gstOut, gstIn, gstNet: gstOut - gstIn, tds, unrec: $db().bank.filter(b => b.status === 'unmatched').length, exc: $db().bank.filter(b => b.status === 'exception').length };
  },
  toggleClose(id) {
    const list = $db().closeChecklist, i = list.findIndex(c => c.id === id), c = list[i];
    if (!c.done && i > 0 && !list[i - 1].done) throw new ServiceError('ORDER', `Complete “${list[i - 1].title}” first.`);
    if (!c.done && c.title === 'Bank reconciled' && this.totals().unrec) throw new ServiceError('BLOCKED', `${this.totals().unrec} bank transactions are still unmatched.`);
    if (!c.done && c.title === 'Exceptions resolved' && this.totals().exc) throw new ServiceError('BLOCKED', `${this.totals().exc} exceptions are still open.`);
    if (c.done && list.slice(i + 1).some(x => x.done)) throw new ServiceError('ORDER', 'Un-tick later steps first.');
    c.done = !c.done; Audit.log('Close checklist: ' + c.title + (c.done ? ' ✓' : ' ✗'), 'period', 'medium');
  },
};

const Admin = {

const ClinicAI = {

  /** runClinicAITask: create task + advance lifecycle; stops at Authorize when approval is needed. */
  runClinicAITask(text) {
    const p = this.plan(text);
    const task = { id: 'AT-' + (903 + $db().aiTasks.length), clinicId: me().clinicId, request: text, by: me().id, at: nowISO(), state: 'Planning', stage: 0, failures: [], result: '', next: '', audit: null, ...p };
    $db().aiTasks.unshift(task);
    if (p.needsClarify) { task.state = 'Blocked'; task.stage = 1; task.next = 'Clarify: try “find tomorrow’s unconfirmed appointments”, “draft recall messages”, “summarise weekly performance”, “identify low-stock items”.'; State.commit(); return task; }
    this._advance(task.id);
    return task;
  },
  _advance(id) {
    const task = State.get('aiTasks', id);
    const step = () => {
      const t = State.get('aiTasks', id); if (!t || ['Cancelled', 'Failed'].includes(t.state)) return;
      if (t.stage === 3) {
        if (t.risk === 'clinical') { t.state = 'Blocked'; t.next = 'Handled by clinician — no AI action taken'; t.audit = Audit.log('AI task blocked (clinical)', 'ai_task:' + t.id, 'high', 'Denied'); State.commit(); return; }
        if (['external', 'patient', 'financial'].includes(t.risk) && !t.approvedBy) { t.state = 'Needs approval'; t.next = t.risk === 'financial' ? 'Owner must authorise' : 'Review preview and approve'; Notify.send('clinic:' + t.clinicId, 'AI approval requested', `${t.id} needs approval.`, '#/clinic/ai'); State.commit(); return; }
      }
      if (t.stage === 5) this._execute(t);
      t.stage++; t.state = t.stage >= 9 ? (t.failures.length ? 'Partially completed' : 'Completed') : t.stage >= 5 ? 'Executing' : 'Planning';
      if (t.stage >= 9) { t.audit = Audit.log('AI task ' + t.state.toLowerCase(), 'ai_task:' + t.id, t.risk === 'read' ? 'low' : 'medium'); Notify.send('clinic:' + t.clinicId, 'AI task completed', `${t.id}: ${t.state}.`, '#/clinic/ai'); State.commit(); return; }
      State.commit(); setTimeout(step, 420);
    };
    setTimeout(step, 300);
  },
  _execute(t) {
    const db = $db();
    if (t.intent === 'confirm') { let sent = 0; t.ids.forEach(aid => { const a = State.get('appointments', aid), p = State.get('patients', a.patientId); if (p.consent.comms) { a.confirmSent = true; sent++; Notify.send(p.id, 'Appointment reminder', 'Please confirm your appointment for tomorrow.', '#/main/appointments'); } else t.failures.push(`${p.name}: no communication consent — skipped`); }); t.result = `${sent} confirmation messages sent (simulated).`; t.next = t.failures.length ? 'Call skipped patients manually' : 'Watch for replies'; }
    if (t.intent === 'recall') { let sent = 0; t.ids.forEach(pid => { const p = State.get('patients', pid); if (p.consent.comms) { p.recallSent = today(); sent++; Notify.send(pid, 'Recall', 'It’s time for your dental check-up. Book when convenient.', '#/main/discover'); } else t.failures.push(`${p.name}: no communication consent — skipped`); }); t.result = `${sent} recall messages sent (simulated). ${t.failures.length} skipped.`; Tasks.create({ title: `Follow up recall no-replies (${t.id})`, assignee: 'u_staff', priority: 'Medium', due: MockData.day(3), source: 'AI task ' + t.id }); t.next = 'Follow-up task created for front desk'; }
    if (t.intent === 'broadcast') { t.result = `Message sent to ${t.audience.length} consented patients (simulated).`; }
    if (t.intent === 'refund') { const inv = State.get('invoices', t.target); if (!inv) { t.failures.push('Invoice not found'); t.result = 'Nothing refunded.'; } else { inv.payments.push({ at: today(), amount: -inv.paid, mode: 'Refund' }); t.result = `Refunded ${fmtINR(inv.paid)} on ${inv.id} (prototype — no money moved).`; inv.paid = 0; inv.status = 'refunded'; } }
    if (t.intent === 'po') { const po = Inventory.draftPO(db.inventory.filter(i => t.ids.includes(i.id)), 'AI ' + t.id); po.status = 'Approved — sent to supplier (simulated)'; t.result = `${po.id} sent to supplier (simulated).`; }
    if (t.intent === 'staff') { t.suggestions.forEach((s, i) => Tasks.create({ title: s, assignee: ['u_staff', 'st6', 'st7'][i], priority: 'Medium', due: MockData.day(0), source: 'AI suggestion' })); t.result = '3 tasks created and assigned (marked “AI suggestion”).'; }
    if (!t.result) t.result = 'Done.';
  },
  approveAITask(id) {
    const t = State.get('aiTasks', id);
    if (!Permissions.guard(Permissions.canApproveAITask(me(), t), 'approve this task')) return;
    t.approvedBy = me().name; t.state = 'Approved'; Audit.log('Approved AI task', 'ai_task:' + id, 'medium');
    State.commit(); this._advance(id);
  },
  reject(id) { const t = State.get('aiTasks', id); t.state = 'Cancelled'; t.next = 'Rejected by ' + me().name; Audit.log('Rejected AI task', 'ai_task:' + id, 'low'); },
};

  answer(q, level = 'Undergraduate', doc = null) {
    const key = Object.keys(this.KB).find(k => q.toLowerCase().includes(k.slice(0, 5)));
    const out = { level, blocks: [], refs: [], uncertain: false };
    if (doc) {
      if (INJECTION.test(doc.content)) out.blocks.push({ kind: 'warn', text: 'Your uploaded document contains embedded instructions. I treat document text as untrusted content and did not follow them.' });
      out.blocks.push({ kind: 'p', text: `From “${doc.name}”: ${doc.pages[1]}` });
      out.refs.push({ label: `${doc.name}, p. 2`, kind: 'doc' }, { label: `${doc.name}, p. 4`, kind: 'doc' });
      out.blocks.push({ kind: 'p', text: 'This answer is grounded in your document; verify against the original before citing.' });
      return out;
    }
    if (key) {
      const k = this.KB[key];
      out.title = k.t; out.blocks.push({ kind: 'p', text: k.b[level] || k.b.Undergraduate });
      out.refs = k.refs.map(id => ({ label: State.get('papers', id).title + ' (' + State.get('papers', id).year + ')', kind: 'paper', id }));
      out.followups = [`How would you test pulp vitality clinically?`, `Compare ${k.t.toLowerCase()} management at UG vs PG level`, 'Make 5 flashcards on this'];

    if (/quiz/i.test(q)) out.quiz = [{ q: 'Which finding best suggests irreversible pulpitis?', o: ['Pain subsiding in 2s', 'Lingering pain >30s', 'No response to cold', 'Mobility'], a: 1 }, { q: 'Osseointegration was described by?', o: ['Black', 'Brånemark', 'Keyes', 'Angle'], a: 1 }];

  TEMPLATES: ['title','section','definition','classification','timeline','mechanism','comparison','workflow','image','chart','evidence','summary','references'],
  blueprint(topic, type) {
    const base = type === 'Journal club' ? ['Introduction & clinical question','Study design (PICO)','Methods','Results','Critical appraisal','Strengths & limitations','Clinical relevance','Discussion points','References']
      : type === 'Case presentation' ? ['Patient context (de-identified)','History','Examination','Investigations','Diagnosis','Treatment planning','Discussion','References']

  generateSlides(project) {
    const map = { 'Definition': 'definition', 'Classification': 'classification', 'Historical timeline': 'timeline', 'Mechanism / pathophysiology': 'mechanism', 'Comparison of approaches': 'comparison', 'Clinical workflow': 'workflow', 'Evidence summary': 'evidence', 'Case illustration': 'image', 'Summary': 'summary', 'References': 'references', 'Results': 'chart', 'Critical appraisal': 'evidence', 'Study design (PICO)': 'comparison', 'Investigations': 'image', 'Treatment planning': 'workflow' };

    project.citations = papers.map(p => p.id);
    const slides = [{ id: 's0', tpl: 'title', title: project.title, lead: `${project.type} · ${project.level} · ${project.spec}`, bullets: [], notes: 'Welcome the audience, state objectives.', cites: [], conf: 'High' }];
    project.blueprint.forEach((b, i) => {
      if (i > 0 && i % 4 === 0) slides.push({ id: 's' + slides.length, tpl: 'section', title: b.title, lead: 'Section ' + (i / 4 + 1), bullets: [], notes: '', cites: [], conf: 'High' });
      const tpl = map[b.title] || 'definition';
      slides.push({ id: 's' + slides.length, tpl, title: b.title, lead: b.notes, bullets: this._bullets(tpl, project.title), notes: `Speaker notes: explain ${b.title.toLowerCase()} in 60–90 seconds; link to ${project.spec}.`, cites: tpl === 'references' ? [] : [papers[i % papers.length]?.id].filter(Boolean), conf: i % 5 === 3 ? 'Medium — verify' : 'High', relevance: project.spec });
